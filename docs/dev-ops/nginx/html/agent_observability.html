<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AutoAgent · Developer Observability Studio</title>
    <style>
        :root{color-scheme:dark;--bg:#090b12;--panel:rgba(24,28,42,.78);--line:#333b56;--text:#f2f5ff;--muted:#9ca6c2;--blue:#8ea3ff;--cyan:#74e4d3;--amber:#ffd180;--red:#ff8191;--shadow:0 24px 80px #0008}
        *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#222c55 0,#0b0e18 42%,#07080d 100%);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);overflow:hidden}
        button{font:inherit;color:inherit}.studio{height:100vh;display:flex;flex-direction:column;background:linear-gradient(135deg,#ffffff06,#00000016)}
        .glass{background:var(--panel);border:1px solid #ffffff15;box-shadow:var(--shadow);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
        .header{height:78px;display:flex;align-items:center;justify-content:space-between;padding:15px 28px;border-bottom:1px solid #ffffff12}.brand{display:flex;gap:14px;align-items:center}.brand-mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--cyan));box-shadow:0 0 28px #8ea3ff77}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--blue);text-transform:uppercase}.title{font-size:19px;font-weight:720}.header-actions{display:flex;gap:10px;align-items:center}.btn{border:1px solid #ffffff1b;background:#ffffff09;border-radius:11px;padding:8px 13px;cursor:pointer}.btn:hover{background:#ffffff17}.status{display:flex;gap:8px;align-items:center;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 16px var(--cyan)}
        .header-meta{display:flex;gap:15px;align-items:center;color:var(--muted);font-size:12px}.header-meta strong{color:var(--text);font-weight:600}.run-header{display:flex;gap:18px;align-items:center}.run-header-item{display:flex;flex-direction:column;min-width:86px}.run-header-item span:first-child{font-size:10px;text-transform:uppercase;color:#78839e;letter-spacing:.08em}.run-header-item span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
        .workspace{display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:0;flex:1}.board{min-width:0;padding:25px 28px 32px;overflow:auto}.board-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.board-head h1{font-size:23px;margin:0 0 4px}.board-head p{margin:0;color:var(--muted)}.counter{color:var(--muted);font-size:12px}.graph-shell{position:relative;min-height:400px;padding:34px 16px 55px;border-radius:24px;overflow-x:auto;overflow-y:hidden}.graph{display:flex;align-items:center;min-height:295px;min-width:max-content;padding:0 24px}.node-wrap{display:flex;align-items:center}.node-wrap.fresh{animation:rise .45s ease both}.node{width:154px;min-height:108px;padding:16px;border-radius:18px;border:1px solid #ffffff1a;background:linear-gradient(150deg,#ffffff12,#ffffff05);cursor:pointer;transition:.25s transform,.25s border-color,.25s box-shadow}.node:hover,.node.selected{transform:translateY(-7px);border-color:#9eb0ff99;box-shadow:0 14px 35px #0007,0 0 26px #819bff26}.node.current{border-color:var(--cyan);box-shadow:0 0 30px #74e4d32b}.node.failed{border-color:var(--red);box-shadow:0 0 30px #ff819125}.node-kicker{color:var(--muted);font-size:11px;margin-bottom:9px}.node-title{font-weight:700;font-size:16px}.node-sub{color:var(--muted);font-size:11px;margin-top:8px}.edge{width:96px;height:2px;background:linear-gradient(90deg,#ffffff25,var(--blue),#ffffff25);position:relative}.edge.fresh{animation:draw .55s ease both}.edge:after{content:"";position:absolute;right:-1px;top:-4px;border-left:9px solid var(--blue);border-top:5px solid transparent;border-bottom:5px solid transparent}.edge-label{position:absolute;left:50%;top:-22px;transform:translateX(-50%);font-size:10px;color:var(--amber);white-space:nowrap;letter-spacing:.04em}.pulse{position:absolute;left:0;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan);animation:travel 2.2s linear infinite}.empty{height:295px;display:grid;place-items:center;color:var(--muted);text-align:center}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;color:var(--muted);font-size:11px}.legend span{display:inline-flex;gap:6px;align-items:center}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--blue)}
        .inspector{min-width:0;border-left:1px solid #ffffff12;padding:23px 20px;overflow:auto}.inspector h2{font-size:16px;margin:0}.inspector-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:15px}.hint{color:var(--muted);font-size:12px}.inspector-tabs{display:flex;gap:6px;overflow:auto;padding-bottom:10px}.tab{white-space:nowrap;border:1px solid transparent;background:none;color:var(--muted);padding:6px 8px;border-radius:8px;cursor:pointer}.tab.active,.tab:hover{color:var(--text);background:#ffffff10;border-color:#ffffff14}.detail-card{border:1px solid #ffffff12;background:#ffffff07;border-radius:15px;padding:13px;margin:9px 0}.detail-card h3{font-size:12px;color:var(--blue);margin:0 0 10px}.field{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid #ffffff0d}.field:last-child{border-bottom:0}.field-key{color:var(--muted);font-size:12px;word-break:break-word}.field-value{min-width:0;word-break:break-word}.value-list{display:grid;gap:7px}.value-list>div{padding:8px;border:1px solid #ffffff10;border-radius:9px;background:#00000015}.mono{font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto}.raw{margin-top:12px}.raw summary{cursor:pointer;color:var(--muted)}.badge{display:inline-flex;border-radius:99px;padding:2px 8px;font-size:10px;background:#ffffff12;color:var(--muted)}.badge.ok{color:var(--cyan)}.badge.bad{color:var(--red)}.section-title{display:flex;justify-content:space-between;align-items:center}.error{color:var(--red)}
        @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}@keyframes draw{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1)}}@keyframes travel{to{left:100%}}@media(max-width:980px){.workspace{grid-template-columns:1fr}.inspector{position:absolute;right:12px;top:90px;bottom:12px;width:min(390px,calc(100vw - 24px));border:1px solid #ffffff18;border-radius:20px}.header-meta{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
    </style>
</head>
<body>
<div class="studio" id="agent-debug-studio">
    <header class="header glass">
        <div class="brand"><div class="brand-mark"></div><div><div class="eyebrow">Developer Observability Studio</div><div class="title">AutoAgent 执行总览</div></div></div>
        <div class="run-header" id="runHeader"></div>
        <div class="header-actions"><div class="status"><i class="dot" id="statusDot"></i><span id="statusText">loading</span></div><button class="btn" id="refreshBtn">刷新</button><button class="btn" id="closeBtn">关闭</button></div>
    </header>
    <main class="workspace">
        <section class="board">
            <div class="board-head"><div><h1>Execution Graph</h1><p>主线按真实事件增量追加；点击节点查看该阶段的结构化数据。</p></div><div class="counter" id="counter">0 个阶段 · 0 轮</div></div>
            <div class="graph-shell glass"><div class="graph" id="graph"><div class="empty">正在加载本次运行……</div></div></div>
            <div class="legend"><span><i style="background:var(--blue)"></i>阶段节点</span><span><i style="background:var(--amber)"></i>action 边标签</span><span><i style="background:var(--cyan)"></i>当前阶段</span><span><i style="background:var(--red)"></i>失败/异常</span></div>
        </section>
        <aside class="inspector glass"><div class="inspector-head"><div><h2 id="inspectorTitle">Inspector</h2><div class="hint" id="inspectorHint">点击主线上的节点查看详情</div></div><span class="badge" id="inspectorBadge">overview</span></div><div class="inspector-tabs" id="tabs"></div><div id="inspectorBody"><div class="detail-card hint">所有真实数据在这里按字段、层级和数组分组展示；Raw 仅作为折叠后的兜底查看。</div></div></aside>
    </main>
</div>
<script>
(() => {
    const params=new URLSearchParams(location.search), runId=params.get("runId"), api=params.get("api")||localStorage.getItem("autoAgentRuntimeApiBase")||location.origin;
    const $=id=>document.getElementById(id), state={snapshot:null,nodes:[],seenNodeIds:new Set(),selected:null,tab:"overview",source:null,retry:0};
    const actionLabels={CALL_TOOL:"tool_use",ASK_USER:"ask_user",RETRIEVE_RAG:"retrieve_rag",DELEGATE_AGENTS:"delegate",READY_TO_DELIVER:"ready_to_deliver",FINAL:"final",CONTINUE:"continue",REPAIR_FINAL:"repair_final"};
    const tabs=["overview","stateView","sources","prompt","input","output","action","runtime","checkpoint","attempts","error","raw"];
    function unwrap(value){if(value&&Object.prototype.hasOwnProperty.call(value,"code")){if(value.code!=="0000")throw Error(value.info||"request failed");return value.data}return value}
    async function fetchJson(path){const r=await fetch(api+path,{headers:{Accept:"application/json"}});if(!r.ok)throw Error(`HTTP ${r.status}`);return unwrap(await r.json())}
    function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
    function pretty(v){try{return JSON.stringify(v,null,2)}catch(_){return String(v??"")}}
    function labelAction(a){return actionLabels[String(a||"").toUpperCase()]||String(a||"").toLowerCase()||"—"}
    function normalize(s){return s||{header:{},context:{},loops:[],traces:[],payloads:{},evidence:[],toolCalls:[],lastSeq:0}}
    async function load(){if(!runId){showError("缺少 runId 参数");return}try{state.snapshot=normalize(await fetchJson(`/agent/runs/${encodeURIComponent(runId)}/debug/studio`));render();state.retry=0}catch(e){showError(e.message);if(state.retry<5){setTimeout(load,Math.min(8000,1000*2**state.retry));state.retry++}}}
    function showError(message){$("statusText").textContent="load failed";$("graph").innerHTML=`<div class="empty"><div><strong class="error">无法加载观测快照</strong><br>${esc(message)}<br><button class="btn" onclick="location.reload()">重试</button></div></div>`}
    function render(){const s=state.snapshot,h=s.header||{};$("statusText").textContent=`${s.status||"unknown"} · ${s.currentPhase||"—"}`;$("runHeader").innerHTML=[["run",h.runId],["session",h.sessionId],["user",h.userId],["agent",h.agentId]].map(x=>`<div class="run-header-item"><span>${x[0]}</span><span title="${esc(x[1])}">${esc(x[1]||"—")}</span></div>`).join("");$("counter").textContent=`${state.nodes.length||buildNodes(s).length} 个阶段 · ${s.loops?.length||0} 轮`;renderGraph(s);renderInspector()}
    function resultNode(loop){const action=String(loop.action||"").toUpperCase(),titles={CALL_TOOL:"Tool Runtime",ASK_USER:"等待用户",RETRIEVE_RAG:"RAG 检索",DELEGATE_AGENTS:"子 Agent",READY_TO_DELIVER:"交付准备",FINAL:"最终交付",REPAIR_FINAL:"最终修复",FAIL:"运行失败"};return action?{id:`result-${loop.loopIndex}-${action}`,kind:action==="FINAL"?"final":"runtime",title:titles[action]||"Runtime",sub:`Loop ${loop.loopIndex} · ${labelAction(action)}`,loop,data:loop}:null}
    function buildNodes(s){const nodes=[{id:"context",kind:"phase",title:"上下文准备",sub:"Context preparation",data:{context:s.context}}];(s.loops||[]).forEach(loop=>{nodes.push({id:`state-${loop.loopIndex}`,kind:"state",title:"State View",sub:`Loop ${loop.loopIndex}`,loop,data:loop});nodes.push({id:`main-${loop.loopIndex}`,kind:"main",title:"MainNode",sub:`Loop ${loop.loopIndex} · ${loop.attempts?.length||0} attempts`,loop,data:loop});const result=resultNode(loop);if(result)nodes.push(result)});if(s.finalAnswer&&!nodes.some(n=>n.kind==="final"))nodes.push({id:"final",kind:"final",title:"最终交付",sub:"Final delivery",data:{finalAnswer:s.finalAnswer}});state.nodes=nodes;return nodes}
    function renderGraph(s){const nodes=buildNodes(s),g=$("graph"),freshIds=new Set(nodes.filter(n=>!state.seenNodeIds.has(n.id)).map(n=>n.id));if(!nodes.length){g.innerHTML='<div class="empty">暂无可视化阶段</div>';return}g.innerHTML=nodes.map((n,i)=>`${i?`<div class="edge ${freshIds.has(n.id)?"fresh":""}"><span class="edge-label">${esc(edgeLabel(n,nodes[i-1]))}</span><span class="pulse"></span></div>`:""}<div class="node-wrap ${freshIds.has(n.id)?"fresh":""}"><div class="node ${n.id===state.selected?"selected":""} ${n.kind==="final"?"current":""} ${Object.keys(n.data?.error||{}).length?"failed":""}" data-node="${esc(n.id)}"><div class="node-kicker">${esc(n.kind.toUpperCase())}</div><div class="node-title">${esc(n.title)}</div><div class="node-sub">${esc(n.sub)}</div></div></div>`).join("");nodes.forEach(n=>state.seenNodeIds.add(n.id));g.querySelectorAll("[data-node]").forEach(el=>{el.addEventListener("click",()=>{state.selected=el.dataset.node;state.tab="overview";renderGraph(s);renderInspector()});el.addEventListener("mouseenter",()=>el.title=nodeHint(nodes.find(n=>n.id===el.dataset.node)))});if(freshIds.size)requestAnimationFrame(()=>g.parentElement.scrollTo({left:g.parentElement.scrollWidth,behavior:"smooth"}))}
    function edgeLabel(n,prev){if(prev?.kind==="main")return labelAction(prev.data?.action);return n.kind==="main"?"mainNode_think":n.kind==="state"?"state_view":n.kind==="final"?"final":"next"}
    function nodeHint(n){return n?`${n.title} · ${n.sub}`:""}
    function currentNode(){const nodes=state.nodes.length?state.nodes:buildNodes(state.snapshot||{});return nodes.find(n=>n.id===state.selected)||nodes[nodes.length-1]}
    function renderInspector(){const n=currentNode(),body=$("inspectorBody");$("tabs").innerHTML=tabs.map(t=>`<button class="tab ${state.tab===t?"active":""}" data-tab="${t}">${tabName(t)}</button>`).join("");$("tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;renderInspector()});if(!n){body.innerHTML='<div class="detail-card hint">暂无详情</div>';return}$("inspectorTitle").textContent=n.title;$("inspectorHint").textContent=n.sub;$("inspectorBadge").textContent=state.tab;body.innerHTML=renderTab(n,state.tab)}
    function tabName(t){return({overview:"Overview",stateView:"State View",sources:"Sources",prompt:"Prompt",input:"Input",output:"Output",action:"Action",runtime:"Runtime",checkpoint:"Checkpoint",attempts:"Attempts",error:"Error",raw:"Raw"})[t]||t}
    function renderTab(n,t){const d=n.data||{};if(t==="overview")return structured({stage:n.title,summary:n.sub,loopIndex:d.loopIndex,status:d.status,action:d.action,attempts:d.attempts?.length});if(t==="stateView")return structured(d.stateView||d.context||{});if(t==="sources")return structured(d.stateViewSources||[]);if(t==="prompt")return renderPrompt(d);if(t==="input")return structured(d.actionInput||{});if(t==="output")return structured(d.actionOutput||{});if(t==="action")return structured({action:d.action,actionInput:d.actionInput,actionOutput:d.actionOutput});if(t==="runtime")return structured(d.runtimeOutcome||{});if(t==="checkpoint")return structured(d.checkpoint||{});if(t==="attempts")return structured(d.attempts||[]);if(t==="error")return structured(d.error||{});return `<details class="raw" open><summary>Raw payload (secondary view)</summary><pre class="mono">${esc(pretty(d))}</pre></details>`}
    function renderPrompt(d){const attempts=d.attempts||[],prompt=attempts.find(a=>a.prompt)?.prompt||"";return `<div class="detail-card"><h3>mainNodePrompt · original model-facing prompt</h3><pre class="mono">${esc(prompt||"该轮暂无 prompt")}</pre></div>`}
    function structured(value){if(value===null||value===undefined||value==="")return '<div class="detail-card hint">无数据</div>';if(typeof value!=="object")return `<div class="detail-card"><div class="field"><span class="field-key">value</span><span class="field-value">${esc(value)}</span></div></div>`;if(Array.isArray(value))return `<div class="value-list">${value.map((v,i)=>`<div><div class="field-key">#${i+1}</div>${renderValue(v)}</div>`).join("")||'<div class="hint">空数组</div>'}</div>`;return `<div class="detail-card">${Object.entries(value).map(([k,v])=>`<div class="field"><span class="field-key">${esc(k)}</span><span class="field-value">${renderValue(v)}</span></div>`).join("")}</div>`}
    function renderStructured(value){return structured(value)}
    function renderValue(v){if(v&&typeof v==="object")return renderStructured(v);return esc(v)}
    function connect(){if(state.source)state.source.close();if(!runId)return;const last=state.snapshot?.lastSeq||0;state.source=new EventSource(`${api}/agent/runs/${encodeURIComponent(runId)}/debug/events/stream?lastSeq=${encodeURIComponent(last)}`);state.source.addEventListener("agent-debug-event",()=>load());state.source.addEventListener("agent-debug-heartbeat",()=>{});state.source.onerror=()=>{state.source?.close();setTimeout(connect,2500)}}
    $("refreshBtn").onclick=()=>load();$("closeBtn").onclick=()=>window.close();window.showDetail=id=>{state.selected=id;renderInspector()};
    load().then(()=>connect());
})();
</script>
</body>
</html>
