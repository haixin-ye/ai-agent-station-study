<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AutoAgent · Developer Observability Studio</title>
    <style>
        :root{color-scheme:dark;--bg:#090b12;--panel:rgba(24,28,42,.78);--line:#333b56;--text:#f2f5ff;--muted:#9ca6c2;--blue:#8ea3ff;--cyan:#74e4d3;--amber:#ffd180;--red:#ff8191;--shadow:0 24px 80px #0008}
        *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#222c55 0,#0b0e18 42%,#07080d 100%);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);overflow:hidden}
        button{font:inherit;color:inherit}.studio{height:100vh;display:flex;flex-direction:column;background:linear-gradient(135deg,#ffffff06,#00000016)}
        .glass{background:var(--panel);border:1px solid #ffffff15;box-shadow:var(--shadow);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
        .header{height:78px;display:flex;align-items:center;justify-content:space-between;padding:15px 28px;border-bottom:1px solid #ffffff12}.brand{display:flex;gap:14px;align-items:center}.brand-mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--cyan));box-shadow:0 0 28px #8ea3ff77}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--blue);text-transform:uppercase}.title{font-size:19px;font-weight:720}.header-actions{display:flex;gap:10px;align-items:center}.btn{border:1px solid #ffffff1b;background:#ffffff09;border-radius:11px;padding:8px 13px;cursor:pointer}.btn:hover{background:#ffffff17}.status{display:flex;gap:8px;align-items:center;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 16px var(--cyan)}
        .header-meta{display:flex;gap:15px;align-items:center;color:var(--muted);font-size:12px}.header-meta strong{color:var(--text);font-weight:600}.run-header{display:flex;gap:18px;align-items:center}.run-header-item{display:flex;flex-direction:column;min-width:86px}.run-header-item span:first-child{font-size:10px;text-transform:uppercase;color:#78839e;letter-spacing:.08em}.run-header-item span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
        .workspace{display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:0;flex:1}.board{min-width:0;padding:25px 28px 32px;overflow:auto}.board-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.board-head h1{font-size:23px;margin:0 0 4px}.board-head p{margin:0;color:var(--muted)}.counter{color:var(--muted);font-size:12px}.loop-switcher{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:0 0 17px}.loop-switcher-label{color:var(--muted);font-size:11px;margin-right:3px}.loop-chip{border:1px solid #ffffff18;background:#ffffff08;border-radius:999px;color:var(--muted);padding:5px 10px;cursor:pointer;transition:.2s}.loop-chip:hover,.loop-chip.active{background:#8ea3ff1c;border-color:#9eb0ff88;color:var(--text);box-shadow:0 0 18px #8ea3ff20}.graph-shell{position:relative;min-height:400px;padding:34px 16px 55px;border-radius:24px;overflow-x:auto;overflow-y:hidden}.graph{display:flex;align-items:center;min-height:295px;min-width:max-content;padding:0 24px}.node-wrap{display:flex;align-items:center}.node-wrap.fresh{animation:rise .45s ease both}.node{width:154px;min-height:108px;padding:16px;border-radius:18px;border:1px solid #ffffff1a;background:linear-gradient(150deg,#ffffff12,#ffffff05);cursor:pointer;transition:.25s transform,.25s border-color,.25s box-shadow}.node:hover,.node.selected{transform:translateY(-7px);border-color:#9eb0ff99;box-shadow:0 14px 35px #0007,0 0 26px #819bff26}.node.current{border-color:var(--cyan);box-shadow:0 0 30px #74e4d32b}.node.failed{border-color:var(--red);box-shadow:0 0 30px #ff819125}.node-kicker{color:var(--muted);font-size:11px;margin-bottom:9px}.node-title{font-weight:700;font-size:16px}.node-sub{color:var(--muted);font-size:11px;margin-top:8px}.edge{width:96px;height:2px;background:linear-gradient(90deg,#ffffff25,var(--blue),#ffffff25);position:relative}.edge.fresh{animation:draw .55s ease both}.edge:after{content:"";position:absolute;right:-1px;top:-4px;border-left:9px solid var(--blue);border-top:5px solid transparent;border-bottom:5px solid transparent}.edge-label{position:absolute;left:50%;top:-22px;transform:translateX(-50%);font-size:10px;color:var(--amber);white-space:nowrap;letter-spacing:.04em}.pulse{position:absolute;left:0;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan);animation:travel 2.2s linear infinite}.hover-preview{position:absolute;z-index:4;left:22px;bottom:16px;width:min(360px,calc(100% - 44px));padding:12px 14px;border-radius:15px;border:1px solid #9eb0ff55;background:rgba(11,14,26,.92);box-shadow:0 18px 45px #0009;backdrop-filter:blur(18px);pointer-events:none;opacity:0;transform:translateY(8px);transition:.2s}.hover-preview.visible{opacity:1;transform:none}.hover-preview h3{font-size:13px;margin:0 0 3px}.hover-preview p{font-size:11px;line-height:1.45;color:var(--muted);margin:0}.empty{height:295px;display:grid;place-items:center;color:var(--muted);text-align:center}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;color:var(--muted);font-size:11px}.legend span{display:inline-flex;gap:6px;align-items:center}.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--blue)}
        .inspector{min-width:0;border-left:1px solid #ffffff12;padding:23px 20px;overflow:auto}.inspector h2{font-size:16px;margin:0}.inspector-head{display:flex;justify-content:space-between;align-items:start;margin-bottom:15px}.hint{color:var(--muted);font-size:12px}.inspector-tabs{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:10px}.tab{white-space:nowrap;border:1px solid transparent;background:none;color:var(--muted);padding:6px 8px;border-radius:8px;cursor:pointer}.tab.active,.tab:hover{color:var(--text);background:#ffffff10;border-color:#ffffff14}.detail-card{border:1px solid #ffffff12;background:#ffffff07;border-radius:15px;padding:13px;margin:9px 0}.detail-card h3{font-size:12px;color:var(--blue);margin:0 0 10px}.detail-intro{border-left:2px solid var(--cyan);padding:9px 11px;margin:0 0 10px;color:#c6cee4;background:#74e4d30b;border-radius:10px;font-size:12px}.field{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid #ffffff0d}.field:last-child{border-bottom:0}.field-key{color:var(--muted);font-size:12px;word-break:break-word}.field-value{min-width:0;word-break:break-word}.value-list{display:grid;gap:7px}.value-list>div{padding:8px;border:1px solid #ffffff10;border-radius:9px;background:#00000015}.mono{font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto}.raw{margin-top:12px}.raw summary{cursor:pointer;color:var(--muted)}.badge{display:inline-flex;border-radius:99px;padding:2px 8px;font-size:10px;background:#ffffff12;color:var(--muted)}.badge.ok{color:var(--cyan)}.badge.bad{color:var(--red)}.section-title{display:flex;justify-content:space-between;align-items:center}.error{color:var(--red)}
        @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}@keyframes draw{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1)}}@keyframes travel{to{left:100%}}@media(max-width:980px){.workspace{grid-template-columns:1fr}.inspector{position:absolute;right:12px;top:90px;bottom:12px;width:min(390px,calc(100vw - 24px));border:1px solid #ffffff18;border-radius:20px}.header-meta{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
    </style>
</head>
<body>
<div class="studio" id="agent-debug-studio">
    <header class="header glass">
        <div class="brand"><div class="brand-mark"></div><div><div class="eyebrow">Developer Observability Studio</div><div class="title">AutoAgent 执行总览</div></div></div>
        <div class="run-header" id="runHeader"></div>
        <div class="header-actions"><div class="status"><i class="dot" id="statusDot"></i><span id="statusText">loading</span></div><button class="btn" id="refreshBtn">刷新</button><button class="btn" id="closeBtn">关闭</button></div>
    </header>
    <main class="workspace">
        <section class="board">
            <div class="board-head"><div><h1>Execution Graph</h1><p>主线按真实事件增量追加；悬停预览、点击固定该阶段的结构化数据。</p></div><div class="counter" id="counter">0 个阶段 · 0 轮</div></div>
            <div class="loop-switcher" id="loopSwitcher" aria-label="轮次切换"></div>
            <div class="graph-shell glass"><div class="graph" id="graph"><div class="empty">正在加载本次运行……</div></div><div class="hover-preview" id="hoverPreview" aria-live="polite"></div></div>
            <div class="legend"><span><i style="background:var(--blue)"></i>阶段节点</span><span><i style="background:var(--amber)"></i>action 边标签</span><span><i style="background:var(--cyan)"></i>当前阶段</span><span><i style="background:var(--red)"></i>失败/异常</span></div>
        </section>
        <aside class="inspector glass"><div class="inspector-head"><div><h2 id="inspectorTitle">Inspector</h2><div class="hint" id="inspectorHint">点击主线上的节点查看详情</div></div><span class="badge" id="inspectorBadge">overview</span></div><div class="inspector-tabs" id="tabs"></div><div id="inspectorBody"><div class="detail-card hint">所有真实数据在这里按字段、层级和数组分组展示；Raw 仅作为折叠后的兜底查看。</div></div></aside>
    </main>
</div>
<script>
(() => {
    const params = new URLSearchParams(location.search);
    const runId = params.get("runId");
    const api = params.get("api") || localStorage.getItem("autoAgentRuntimeApiBase") || location.origin;
    const $ = id => document.getElementById(id);
    const state = {snapshot:null, nodes:[], seenNodeIds:new Set(), selected:null, hovered:null, tab:"overview", source:null, retry:0, loopFilter:"all", resetGraphScroll:false};
    const actionLabels = {CALL_TOOL:"tool_use", ASK_USER:"ask_user", RETRIEVE_RAG:"retrieve_rag", DELEGATE_AGENTS:"delegate", READY_TO_DELIVER:"ready_to_deliver", FINAL:"final", CONTINUE:"continue", REPAIR_FINAL:"repair_final"};
    const tabs = ["overview","stateView","sources","prompt","input","output","action","runtime","tools","childAgents","checkpoint","attempts","error","context","evidence","timeline","payloads","pending","final","raw"];
    const tabNames = {overview:"Overview", stateView:"State View", sources:"Sources", prompt:"Prompt", input:"Input", output:"Output", action:"Action", runtime:"Runtime", tools:"Tool Results", childAgents:"Child Agents", checkpoint:"Checkpoint", attempts:"Attempts", error:"Error", context:"Context", evidence:"Evidence", timeline:"Timeline", payloads:"Payloads", pending:"Pending Input", final:"Final Answer", raw:"Raw"};
    const tabIntros = {
        overview:"先确认该节点属于哪一轮、当前状态、action 和尝试次数。",
        stateView:"这里是本轮 MainNode 实际看到的状态视图，用来判断记忆和上下文是否正确。",
        sources:"这里拆开 state view 的来源，显示每类记忆、工具结果和上下文材料的来源数量。",
        prompt:"这里展示原始 model-facing prompt，保持英文和完整内容，便于检查提示词拼装。",
        input:"这里展示进入该阶段的结构化输入，而不是只显示一个摘要。",
        output:"这里展示该阶段产生的结构化输出和解析结果。",
        action:"这里对照 action 名称、输入参数与输出结果，定位路由前后的差异。",
        runtime:"这里展示 Runtime 实际处理 action 后的结果、状态变化和路由信息。",
        tools:"这里展示 tool 参数、调用结果和 receipt，用于核对工具是否返回了预期数据。",
        childAgents:"这里展示子 Agent 的任务、状态和返回内容。",
        checkpoint:"这里展示 ask_user 创建的 checkpoint、问题、选项和恢复信息。",
        attempts:"这里按 attempt 展示原始输入、输出、修复尝试以及 contract 校验结果。",
        error:"这里集中展示本阶段失败类型、错误消息和关联 payload。",
        context:"这里展示本次 run 的基础上下文、任务账本和 Runtime 控制信息。",
        evidence:"这里展示本次运行沉淀的 evidence，便于判断最终结论的依据。",
        timeline:"这里按 seq 查看运行事件时间线，确认阶段是否按预期推进。",
        payloads:"这里展示 payload 引用与结构化预览，方便从 trace 追到真实中间数据。",
        pending:"这里展示当前运行的 pending input；如果没有暂停，会显示暂无数据。",
        final:"这里展示最终交付内容，用来区分中间输出问题和总结阶段问题。",
        raw:"Raw 只作为折叠后的兜底视图；日常排查优先使用上面的结构化标签。"
    };
    const stageDescriptions = {phase:"运行开始时准备一次的上下文材料", state:"本轮 MainNode 看到的完整 State View", main:"MainNode 的思考、输入、输出和 action 决策", runtime:"Runtime 对 action 的确定性处理结果", final:"最终修复或最终交付阶段"};
    function unwrap(value){if(value && Object.prototype.hasOwnProperty.call(value,"code")){if(value.code!=="0000")throw Error(value.info||"request failed");return value.data}return value}
    async function fetchJson(path){const response=await fetch(api+path,{headers:{Accept:"application/json"}});if(!response.ok)throw Error(`HTTP ${response.status}`);return unwrap(await response.json())}
    function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
    function pretty(value){try{return JSON.stringify(value,null,2)}catch(_){return String(value??"")}}
    function labelAction(action){return actionLabels[String(action||"").toUpperCase()]||String(action||"").toLowerCase()||"—"}
    function normalize(snapshot){return Object.assign({header:{},context:{},loops:[],traces:[],payloads:{},evidence:[],toolCalls:[],pendingInput:null,finalAnswer:null,lastSeq:0},snapshot||{})}
    function activeLoops(snapshot){const loops=snapshot.loops||[];return state.loopFilter==="all"?loops:loops.filter(loop=>String(loop.loopIndex)===String(state.loopFilter))}
    async function load(){if(!runId){showError("缺少 runId 参数");return}try{state.snapshot=normalize(await fetchJson(`/agent/runs/${encodeURIComponent(runId)}/debug/studio`));render();state.retry=0}catch(error){showError(error.message);if(state.retry<5){setTimeout(load,Math.min(8000,1000*2**state.retry));state.retry++}}}
    function showError(message){$("statusText").textContent="load failed";$("graph").innerHTML=`<div class="empty"><div><strong class="error">无法加载观测快照</strong><br>${esc(message)}<br><button class="btn" onclick="location.reload()">重试</button></div></div>`}
    function render(){const snapshot=state.snapshot||normalize(), header=snapshot.header||{}, nodes=buildNodes(snapshot);$("statusText").textContent=`${snapshot.status||"unknown"} · ${snapshot.currentPhase||"—"}`;$("runHeader").innerHTML=[["run",header.runId],["session",header.sessionId],["user",header.userId],["agent",header.agentId]].map(item=>`<div class="run-header-item"><span>${item[0]}</span><span title="${esc(item[1])}">${esc(item[1]||"—")}</span></div>`).join("");$("counter").textContent=`${nodes.length} 个阶段 · ${activeLoops(snapshot).length} 轮${state.loopFilter==="all"?"":" · 当前筛选 Loop "+state.loopFilter}`;renderLoopSwitcher(snapshot);renderGraph(snapshot);renderInspector()}
    function renderLoopSwitcher(snapshot){const element=$("loopSwitcher"), loops=snapshot.loops||[];if(!loops.length){element.innerHTML='<span class="loop-switcher-label">轮次</span><span class="hint">运行尚未产生 loop</span>';return}const options=[{value:"all",label:"全部轮次"},...loops.map(loop=>({value:String(loop.loopIndex),label:`Loop ${loop.loopIndex}`}))];element.innerHTML=`<span class="loop-switcher-label">轮次视图</span>${options.map(option=>`<button class="loop-chip ${String(state.loopFilter)===option.value?"active":""}" data-loop-filter="${esc(option.value)}">${esc(option.label)}</button>`).join("")}`;element.querySelectorAll("[data-loop-filter]").forEach(button=>button.addEventListener("click",()=>{state.loopFilter=button.dataset.loopFilter;state.selected=state.loopFilter==="all"?null:`main-${state.loopFilter}`;state.tab="overview";state.resetGraphScroll=true;render()}))}
    function resultNode(loop){const action=String(loop.action||"").toUpperCase(), titles={CALL_TOOL:"Tool Runtime",ASK_USER:"等待用户",RETRIEVE_RAG:"RAG 检索",DELEGATE_AGENTS:"子 Agent",READY_TO_DELIVER:"交付准备",FINAL:"最终交付",REPAIR_FINAL:"最终修复",FAIL:"运行失败"};return action?{id:`result-${loop.loopIndex}-${action}`,kind:action==="FINAL"?"final":"runtime",title:titles[action]||"Runtime",sub:`Loop ${loop.loopIndex} · ${labelAction(action)}`,loop,data:loop}:null}
    function buildNodes(snapshot){const nodes=[{id:"context",kind:"phase",title:"上下文准备",sub:"Context preparation",data:{context:snapshot.context}}];activeLoops(snapshot).forEach(loop=>{nodes.push({id:`state-${loop.loopIndex}`,kind:"state",title:"State View",sub:`Loop ${loop.loopIndex}`,loop,data:loop});nodes.push({id:`main-${loop.loopIndex}`,kind:"main",title:"MainNode",sub:`Loop ${loop.loopIndex} · ${loop.attempts?.length||0} attempts`,loop,data:loop});const result=resultNode(loop);if(result)nodes.push(result)});if(snapshot.finalAnswer&&!nodes.some(node=>node.kind==="final"))nodes.push({id:"final",kind:"final",title:"最终交付",sub:"Final delivery",data:{finalAnswer:snapshot.finalAnswer}});state.nodes=nodes;return nodes}
    function renderGraph(snapshot){const nodes=buildNodes(snapshot), graph=$("graph"), freshIds=new Set(nodes.filter(node=>!state.seenNodeIds.has(node.id)).map(node=>node.id));if(!nodes.length){graph.innerHTML='<div class="empty">暂无可视化阶段</div>';return}graph.innerHTML=nodes.map((node,index)=>`${index?`<div class="edge ${freshIds.has(node.id)?"fresh":""}"><span class="edge-label">${esc(edgeLabel(node,nodes[index-1]))}</span><span class="pulse"></span></div>`:""}<div class="node-wrap ${freshIds.has(node.id)?"fresh":""}"><div class="node ${node.id===state.selected?"selected":""} ${node.kind==="final"?"current":""} ${Object.keys(node.data?.error||{}).length?"failed":""}" data-node="${esc(node.id)}"><div class="node-kicker">${esc(node.kind.toUpperCase())}</div><div class="node-title">${esc(node.title)}</div><div class="node-sub">${esc(node.sub)}</div></div></div>`).join("");nodes.forEach(node=>state.seenNodeIds.add(node.id));graph.querySelectorAll("[data-node]").forEach(element=>{const node=nodes.find(item=>item.id===element.dataset.node);element.addEventListener("click",()=>{state.selected=element.dataset.node;state.tab="overview";hideHoverPreview();renderGraph(snapshot);renderInspector()});element.addEventListener("mouseenter",()=>{state.hovered=node;showHoverPreview(node)});element.addEventListener("mouseleave",()=>{state.hovered=null;hideHoverPreview()})});if(state.resetGraphScroll){state.resetGraphScroll=false;requestAnimationFrame(()=>graph.parentElement.scrollTo({left:0,behavior:"smooth"}))}else if(freshIds.size){requestAnimationFrame(()=>graph.parentElement.scrollTo({left:graph.parentElement.scrollWidth,behavior:"smooth"}))}}
    function edgeLabel(node,previous){if(previous?.kind==="main")return labelAction(previous.data?.action);return node.kind==="main"?"mainNode_think":node.kind==="state"?"state_view":node.kind==="final"?"final":"next"}
    function nodeHint(node){return node?`${node.title} · ${stageDescriptions[node.kind]||node.sub}`:""}
    function showHoverPreview(node){if(!node)return;const data=node.data||{}, preview=$("hoverPreview");const details=node.kind==="main"?`Loop ${data.loopIndex} · ${data.attempts?.length||0} attempts · action ${labelAction(data.action)}`:node.kind==="state"?`Loop ${data.loopIndex} · ${Object.keys(data.stateView||{}).length} state view fields`:node.kind==="runtime"?`Loop ${data.loopIndex} · runtime outcome ${Object.keys(data.runtimeOutcome||{}).length} fields`:node.kind==="phase"?"本次 run 只准备一次，后续轮次复用并刷新状态视图":"最终回答和交付结果";preview.innerHTML=`<h3>${esc(node.title)}</h3><p>${esc(nodeHint(node))}<br>${esc(details)}<br><span class="hint">点击节点固定到右侧 Inspector</span></p>`;preview.classList.add("visible")}
    function hideHoverPreview(){const preview=$("hoverPreview");if(!state.hovered)preview.classList.remove("visible")}
    function currentNode(){const nodes=state.nodes.length?state.nodes:buildNodes(state.snapshot||{});const preferred=state.loopFilter!=="all"?nodes.find(node=>node.id===`main-${state.loopFilter}`):null;return nodes.find(node=>node.id===state.selected)||preferred||nodes[nodes.length-1]}
    function renderInspector(){const node=currentNode(), body=$("inspectorBody");$("tabs").innerHTML=tabs.map(tab=>`<button class="tab ${state.tab===tab?"active":""}" data-tab="${tab}">${tabNames[tab]||tab}</button>`).join("");$("tabs").querySelectorAll(".tab").forEach(button=>button.onclick=()=>{state.tab=button.dataset.tab;renderInspector()});if(!node){body.innerHTML='<div class="detail-card hint">暂无详情</div>';return}$("inspectorTitle").textContent=node.title;$("inspectorHint").textContent=nodeHint(node);$("inspectorBadge").textContent=state.tab;body.innerHTML=`<div class="detail-intro">${esc(tabIntros[state.tab]||"")}</div>${renderTab(node,state.tab)}`}
    function renderTab(node,tab){const data=node.data||{}, snapshot=state.snapshot||{};if(tab==="overview")return structured({stage:node.title,summary:node.sub,loopIndex:data.loopIndex,status:data.status,stageCode:data.stage,action:data.action,attempts:data.attempts?.length,startedAt:data.startedAt,completedAt:data.completedAt});if(tab==="stateView")return structured(data.stateView||data.context||{});if(tab==="sources")return structured(data.stateViewSources||[]);if(tab==="prompt")return renderPrompt(data);if(tab==="input")return structured(data.actionInput||{});if(tab==="output")return structured(data.actionOutput||{});if(tab==="action")return structured({action:data.action,actionInput:data.actionInput,actionOutput:data.actionOutput});if(tab==="runtime")return structured(data.runtimeOutcome||{});if(tab==="tools")return structured(data.toolResults?.length?data.toolResults:snapshot.toolCalls||[]);if(tab==="childAgents")return structured(data.childAgentResults||[]);if(tab==="checkpoint")return structured(data.checkpoint||{});if(tab==="attempts")return structured(data.attempts||[]);if(tab==="error")return structured(data.error||{});if(tab==="context")return structured(snapshot.context||{});if(tab==="evidence")return structured(snapshot.evidence||[]);if(tab==="timeline")return structured(snapshot.traces||[]);if(tab==="payloads")return structured(snapshot.payloads||{});if(tab==="pending")return structured(data.checkpoint||snapshot.pendingInput||{});if(tab==="final")return structured({finalAnswer:snapshot.finalAnswer});return `<details class="raw" open><summary>Raw payload (secondary view)</summary><pre class="mono">${esc(pretty(data))}</pre></details>`}
    function renderPrompt(data){const attempt=(data.attempts||[]).find(item=>item.prompt||item.systemPrompt||item.userPrompt)||{};const prompt=attempt.prompt||[attempt.systemPrompt,attempt.userPrompt].filter(Boolean).join("\n\n");return `<div class="detail-card"><h3>mainNodePrompt · original model-facing prompt</h3><div class="field"><span class="field-key">attemptNo</span><span class="field-value">${esc(attempt.attemptNo??"—")}</span></div><pre class="mono">${esc(prompt||"该轮暂无 prompt")}</pre></div>`}
    function structured(value){if(value===null||value===undefined||value==="")return '<div class="detail-card hint">无数据</div>';if(typeof value!=="object")return `<div class="detail-card"><div class="field"><span class="field-key">value</span><span class="field-value">${esc(value)}</span></div></div>`;if(Array.isArray(value))return `<div class="value-list">${value.map((item,index)=>`<div><div class="field-key">#${index+1}</div>${renderValue(item)}</div>`).join("")||'<div class="hint">空数组</div>'}</div>`;return `<div class="detail-card">${Object.entries(value).map(([key,item])=>`<div class="field"><span class="field-key">${esc(key)}</span><span class="field-value">${renderValue(item)}</span></div>`).join("")}</div>`}
    function renderStructured(value){return structured(value)}
    function renderValue(value){return value&&typeof value==="object"?renderStructured(value):esc(value)}
    function connect(){if(state.source)state.source.close();if(!runId)return;const last=state.snapshot?.lastSeq||0;state.source=new EventSource(`${api}/agent/runs/${encodeURIComponent(runId)}/debug/events/stream?lastSeq=${encodeURIComponent(last)}`);state.source.addEventListener("agent-debug-event",()=>load());state.source.addEventListener("agent-debug-heartbeat",()=>{});state.source.onerror=()=>{state.source?.close();setTimeout(connect,2500)}}
    $("refreshBtn").onclick=()=>load();$("closeBtn").onclick=()=>window.close();window.showDetail=id=>{state.selected=id;state.tab="overview";renderInspector()};
    load().then(()=>connect());
})();
</script>
