    <title>AutoAgent · Developer Trace Studio</title>
    <style>
        :root{color-scheme:dark;--bg:#080b12;--panel:rgba(20,26,39,.82);--panel-2:rgba(25,32,48,.92);--line:#ffffff18;--line-strong:#ffffff2c;--text:#f4f7ff;--muted:#9ba8c4;--blue:#93a8ff;--violet:#c5a5ff;--cyan:#64e2d2;--amber:#ffd27a;--red:#ff7e91;--green:#7ae2bd;--shadow:0 24px 90px #000b}

        .workspace{min-height:0;flex:1;display:flex;flex-direction:column}.board{min-height:0;flex:1;display:flex;flex-direction:column;padding:25px 28px 22px;overflow:hidden}.board-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:14px}.board-head h1{font-size:23px;line-height:1.2;margin:0 0 5px;letter-spacing:-.03em}.board-head p{margin:0;color:var(--muted)}.counter{font-size:12px;color:var(--muted);white-space:nowrap}.loop-switcher{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:16px}.loop-switcher-label{font-size:11px;color:var(--muted);margin-right:3px}.loop-chip{border:1px solid var(--line);background:#ffffff08;color:var(--muted);border-radius:999px;padding:5px 11px;cursor:pointer}.loop-chip:hover,.loop-chip.active{color:var(--text);background:#9aaeff1c;border-color:#9aaeff66}
        .graph-shell{position:relative;min-height:280px;flex:1;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#ffffff07,#00000016)}.graph-scroll{height:100%;overflow:auto;padding:66px 46px 80px;scroll-behavior:smooth}.graph-scroll::-webkit-scrollbar,.detail-body::-webkit-scrollbar{height:8px;width:8px}.graph-scroll::-webkit-scrollbar-thumb,.detail-body::-webkit-scrollbar-thumb{background:#ffffff20;border-radius:99px}.graph{min-width:max-content;min-height:100%;display:flex;align-items:center;gap:0;position:relative}.graph:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,transparent,#9eafff38 10%,#9eafff55 50%,transparent);pointer-events:none}.node-wrap{width:194px;position:relative;z-index:1;flex:none}.node{min-height:112px;border-radius:20px;padding:16px 15px;border:1px solid #ffffff24;background:linear-gradient(145deg,#222c45e8,#121827e8);box-shadow:0 16px 32px #0007;cursor:pointer;transition:transform .25s,box-shadow .25s,border-color .25s;animation:nodeIn .52s cubic-bezier(.2,.8,.2,1) both}.node:hover{transform:translateY(-7px);box-shadow:0 22px 44px #000b;border-color:#c4d0ff88}.node.selected{border-color:#cbd6ff;box-shadow:0 0 0 2px #9eafff4d,0 24px 54px #000b}.node.running{border-color:#93a8ffb3;box-shadow:0 0 0 1px #93a8ff55,0 0 30px #93a8ff25}.node.succeeded{border-color:#64e2d266}.node.waiting{border-color:#ffd27a88}.node.failed{border-color:#ff7e91c7;background:linear-gradient(145deg,#3b1f35e8,#1c1424e8);box-shadow:0 0 0 1px #ff7e9144,0 18px 38px #000b}.node-kicker{font-size:10px;color:var(--blue);letter-spacing:.13em;font-weight:730}.node.succeeded .node-kicker{color:var(--cyan)}.node.waiting .node-kicker{color:var(--amber)}.node.failed .node-kicker{color:var(--red)}.node-title{font-size:17px;font-weight:760;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node-sub{font-size:12px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node-status{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);margin-top:14px}.node-status i{width:6px;height:6px;border-radius:50%;background:var(--cyan)}.node.waiting .node-status i{background:var(--amber)}.node.failed .node-status i{background:var(--red)}.edge{width:92px;flex:none;height:74px;position:relative;display:flex;align-items:center;justify-content:center}.edge:before{content:"";height:2px;width:100%;background:linear-gradient(90deg,#7589ceaa,#64e2d2cc);transform-origin:left;animation:draw .55s ease both}.edge:after{content:"";position:absolute;right:-1px;width:8px;height:8px;border-top:2px solid var(--cyan);border-right:2px solid var(--cyan);transform:rotate(45deg)}.edge-label{position:absolute;top:11px;max-width:90px;padding:2px 7px;border-radius:99px;color:var(--amber);font-size:10px;background:#171b2bd9;border:1px solid #ffd27a33;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.edge.fresh:before{animation:draw .55s ease both}.edge.fresh:after{animation:arrowIn .55s ease both}.pulse{position:absolute;left:0;top:35px;width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 13px var(--cyan);animation:travel 1.7s linear infinite}
        .legend{display:flex;gap:18px;flex-wrap:wrap;padding:12px 5px 0;color:var(--muted);font-size:11px}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}.empty{height:100%;min-height:220px;display:grid;place-items:center;color:var(--muted);text-align:center}.error{color:var(--red)}
        .hover-preview{position:fixed;z-index:8;width:min(470px,calc(100vw - 28px));max-height:310px;overflow:auto;padding:17px 18px;border-radius:18px;background:rgba(19,25,39,.96);border:1px solid #b8c7ff66;box-shadow:0 24px 72px #000d,0 0 30px #92a9ff22;opacity:0;pointer-events:none;transform:translateY(7px);transition:opacity .18s,transform .18s}.hover-preview.visible{opacity:1;transform:none}.hover-preview h3{margin:0;font-size:16px}.hover-preview p{color:var(--muted);margin:6px 0 0}.hover-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.fact{padding:8px 9px;border:1px solid var(--line);background:#ffffff07;border-radius:10px}.fact b{display:block;color:var(--text);font-size:13px}.fact span{font-size:10px;color:var(--muted)}

    <style>
        /* Keep long causal labels readable; the graph itself remains horizontally scrollable. */
        .edge{width:122px}
        .edge-label{max-width:140px;overflow:visible;text-overflow:clip}
    </style>
    <style>
        /* Evidence is read as a set of modules, not as a dense JSON wall. */
        .detail-body{padding:28px 34px 42px;font-size:14px}
        .detail-intro{font-size:14px;line-height:1.75;max-width:880px;margin-bottom:22px}
        .detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
        .detail-card{padding:19px 20px;border-radius:19px}
        .detail-card h3{font-size:16px;line-height:1.4;margin-bottom:14px}
        .detail-card h3 small{font-size:11px}
        .evidence-module{border:1px solid #ffffff1c;border-radius:18px;background:linear-gradient(145deg,#ffffff0b,#00000014);overflow:hidden;margin:0 0 13px}
        .evidence-module:last-child{margin-bottom:0}
        .evidence-module>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:17px 19px;cursor:pointer;min-height:76px}
        .evidence-module>summary::-webkit-details-marker{display:none}
        .evidence-module>summary:before{content:"+";order:3;flex:none;width:25px;height:25px;display:grid;place-items:center;border:1px solid #ffffff25;border-radius:8px;color:var(--blue);font-size:17px;line-height:1}
        .evidence-module[open]>summary:before{content:"−";color:var(--cyan)}
        .module-heading{display:flex;align-items:flex-start;gap:12px;min-width:0}
        .module-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:#93a8ff17;color:var(--blue);font-size:14px;flex:none}
        .module-title{font-size:15px;font-weight:760;color:#eef3ff;line-height:1.35}
        .module-description{font-size:12px;color:var(--muted);line-height:1.6;margin-top:4px}
        .module-metric{flex:none;border:1px solid #64e2d233;background:#64e2d20d;color:var(--cyan);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;white-space:nowrap}
        .module-content{padding:0 19px 20px;border-top:1px solid #ffffff12}
        .module-content>.detail-grid{padding-top:18px}
        .module-content>.candidate-grid,.module-content>.tree,.module-content>.timeline{padding-top:18px}
        .candidate-grid{gap:13px}
        .candidate-card{padding:14px 15px;min-height:104px;border-radius:15px}
        .candidate-card h4{font-size:14px;line-height:1.45;margin-bottom:8px}
        .candidate-card p{font-size:13px;line-height:1.65;-webkit-line-clamp:4}
        .candidate-card .count{font-size:14px}
        .source-pill{font-size:11px;padding:3px 8px}
        .field{grid-template-columns:minmax(145px,30%) minmax(0,1fr);gap:16px;padding:10px 0}
        .field-key{font-size:12px;line-height:1.55}
        .field-value{font-size:13px;line-height:1.65}
        .tree{gap:9px}
        .tree summary{font-size:13px;line-height:1.6;padding:3px 0}
        .tree-item{padding:11px 12px;border-radius:12px}
        .tree-value{padding:9px 0 3px}
        .timeline{gap:11px}
        .timeline-item{padding:13px 13px 13px 17px;min-height:88px}
        .timeline-item b{font-size:13px}
        .timeline-item span{font-size:12px;line-height:1.5}
        .secondary{margin-top:0;padding:0;border:0;background:none}
        .secondary summary{font-size:13px;padding:12px 0;color:#c4d0ee}
        .mono{font-size:12px;line-height:1.75;max-height:430px;padding:14px;border:1px solid #ffffff12;border-radius:12px;background:#00000018}
        .empty-small{font-size:13px;line-height:1.6}
        .detail-sub{font-size:14px;line-height:1.6}
        @media(max-width:900px){.detail-body{padding:22px 18px 30px}.detail-grid{grid-template-columns:1fr}.evidence-module>summary{padding:15px}.module-content{padding:0 15px 17px}.field{grid-template-columns:1fr;gap:3px}}
    </style>
    <style>
        /* Content-first evidence boards: large modules establish hierarchy, small cards expose real records. */
        .detail-shell{width:min(1460px,calc(100vw - 34px));height:min(92vh,980px)}
        .detail-head{padding:24px 32px 20px}.detail-title{font-size:26px}.detail-body{padding:28px 32px 48px}
        .module-board{position:relative;border:1px solid #ffffff1d;border-radius:22px;background:linear-gradient(145deg,rgba(31,39,59,.76),rgba(11,16,27,.72));box-shadow:0 16px 38px #0003;overflow:hidden;margin:0 0 18px}
        .module-board.core{border-color:#8fa6ff4b;background:linear-gradient(145deg,rgba(41,53,83,.82),rgba(12,18,31,.76))}
        .module-board.new-data{border-color:#64e2d24a;box-shadow:inset 0 1px #64e2d215,0 18px 42px #0004}
        .module-board.failure-board{border-color:#ff7e9163;background:linear-gradient(145deg,rgba(78,28,43,.82),rgba(19,14,24,.82));box-shadow:inset 0 1px #ff9aad24,0 18px 48px #0005}
        .module-board.failure-board .module-board-metric{border-color:#ff7e9155;background:#ff7e9112;color:#ffadb9}
        .module-board>summary{list-style:none;cursor:pointer}.module-board>summary::-webkit-details-marker{display:none}
        .module-board-header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:20px 22px;border-bottom:1px solid #ffffff12}
        details.module-board:not([open])>.module-board-header{border-bottom:0}
        details.module-board>.module-board-header:after{content:"+";width:28px;height:28px;display:grid;place-items:center;border:1px solid #ffffff26;border-radius:9px;color:var(--blue);font-size:18px;flex:none}
        details.module-board[open]>.module-board-header:after{content:"−";color:var(--cyan)}
        .module-board-heading{display:flex;align-items:center;gap:13px;min-width:0;flex:1}
        .module-board-icon{width:36px;height:36px;display:grid;place-items:center;flex:none;border-radius:12px;background:linear-gradient(145deg,#9bafff20,#64e2d210);border:1px solid #ffffff13;color:#b9c7ff;font-size:16px}
        .module-board-title{font-size:18px;font-weight:780;letter-spacing:-.015em;color:#f2f6ff}
        .module-board-description{font-size:13px;line-height:1.55;color:var(--muted);margin-top:3px}
        .module-board-metric{margin-left:auto;white-space:nowrap;border:1px solid #64e2d238;background:#64e2d20c;color:var(--cyan);padding:6px 11px;border-radius:999px;font-size:12px;font-weight:720}
        .module-board-body{padding:19px 21px 22px}
        .mini-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
        .mini-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
        .mini-card{min-width:0;border:1px solid #ffffff18;border-radius:16px;background:linear-gradient(145deg,#ffffff0a,#00000013);padding:14px 15px;transition:transform .18s,border-color .18s,background .18s}
        .mini-card:hover{transform:translateY(-2px);border-color:#a9b9ff58;background:linear-gradient(145deg,#ffffff0e,#00000010)}
        .mini-card.accent{border-color:#93a8ff4d;background:linear-gradient(145deg,#93a8ff15,#ffffff06)}
        .mini-card.changed{border-color:#64e2d257;background:linear-gradient(145deg,#64e2d215,#ffffff05)}
        .mini-card.warning{border-color:#ffd27a4a;background:linear-gradient(145deg,#ffd27a12,#ffffff05)}
        .mini-card.error-card{border-color:#ff7e9157;background:linear-gradient(145deg,#ff7e9113,#ffffff04)}
        .mini-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
        .mini-card-kicker{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:#8191b4}
        .mini-card-title{font-size:14px;font-weight:760;line-height:1.45;color:#edf2ff;margin-top:4px;word-break:break-word}
        .mini-card-badge{flex:none;border:1px solid #ffffff1e;border-radius:999px;padding:3px 7px;font-size:10px;color:#b8c5e4;background:#ffffff07}
        .mini-card.changed .mini-card-badge{color:var(--cyan);border-color:#64e2d23d}
        .mini-card-copy{font-size:12px;line-height:1.65;color:var(--muted);margin-top:9px;white-space:pre-wrap;word-break:break-word}

            const element=[...$("graph").querySelectorAll("[data-node]")].find(node=>node.dataset.node===String(nodeId));
            element?.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
        });
    }
    function renderDebugFailureBoard(d,node){
        const actionTypes=["TOOL_USE","ASK_USER","DELEGATE","RAG_RETRIEVAL","READY_TO_DELIVER","FINAL_DELIVERY","RUNTIME_ACTION"],failures=AgentObservabilityLogic.collectDebugFailures(d,node,state.events).filter(item=>!(actionTypes.includes(node.type)&&item.source==="Node error"));
        if(!failures.length)return "";

            item.code||"UNCLASSIFIED_FAILURE",`${item.source} · ${item.stage||node.type}`,
            item.message||"已记录失败，但没有可读错误消息",item.status||"FAILED",
            {source:item.source,stage:item.stage,code:item.code,status:item.status,message:item.message,raw:item.detail},"error-card"

        return moduleBoard("调试故障证据","从模型契约、工具 receipt、RuntimeOutcome、任务阻塞、子 Agent 和生命周期事件中抽取真实失败信号；错误码优先展示，原始字段点击卡片查看。",
            `${failures.length} 个故障信号`,body,{core:true,changed:true,icon:"!",tone:"failure-board"});

    function renderDetailBodyV2(node){
        const details=node.details||{};
        switch(node.type){
            case"CONTEXT_PREPARE":return renderContextPrepareV2(details);
            case"CONTEXT_PLANNER":return renderPlannerV2(details);
            case"STATE_VIEW":return renderStateV2(details,node);
            case"MAIN_NODE":return renderMainV2(details,node);
            case"TOOL_USE":return renderActionV3(details,"TOOL_USE");
            case"ASK_USER":return renderActionV3(details,"ASK_USER");
            case"DELEGATE":return renderActionV3(details,"DELEGATE");
            case"RAG_RETRIEVAL":return renderActionV3(details,"RAG_RETRIEVAL");
            case"READY_TO_DELIVER":return renderActionV3(details,"READY_TO_DELIVER");
            case"FINAL_DELIVERY":return renderFinalDelivery(details);
            case"RUNTIME_FAILURE":return moduleBoard("运行级终止","该故障来自后端执行边界，不属于某个正常 action；本次运行不会再继续等待。",details.failureCode||"FAILED",miniCard(details.failureCode||"UNEXPECTED_RUNTIME_ERROR","后端 Runtime",node.summary||"本次运行已终止","FAILED",details,"error-card"),{core:true,changed:true,icon:"!",tone:"failure-board"});
            default:return renderActionV2(details,node.type);
        }
    }
    function renderDetailBodyV3(node){
        return renderDebugFailureBoard(node.details||{},node)+renderDetailBodyV2(node);
    }
    renderDetailBody=renderDetailBodyV3;
    function graphNodeHtml(node,index,previous,fresh){
        const edge=index?`<div class="edge ${fresh?"fresh":""}" data-edge-before="${esc(node.id)}"><span class="edge-label">${esc(edgeLabel(previous,node))}</span><span class="pulse"></span></div>`:"";
        return `${edge}<div class="node-wrap ${fresh?"fresh":""}" data-node-wrap="${esc(node.id)}"><article class="node ${nodeClass(node)} ${node.id===state.selected?"selected":""}" data-node="${esc(node.id)}"><div class="node-kicker">${esc(node.type||"NODE")}</div><div class="node-title">${esc(nodeDisplayTitle(node))}</div><div class="node-sub">${esc(node.loopIndex==null?node.summary||typeCopy[node.type]||"":`Loop ${node.loopIndex} · ${node.summary||typeCopy[node.type]||""}`)}</div><div class="node-status"><i></i>${esc(nodeStatusLabel(node))}</div></article></div>`;
    }
    function executionLaneHtml(lane,fresh){
        const label=lane.loopIndex==null?"PREP":`LOOP ${lane.loopIndex}`;
        return `<section class="execution-lane ${fresh?"fresh-lane":""}" data-lane-key="${esc(lane.key)}"><div class="lane-label">${esc(label)}</div><div class="lane-track" data-lane-track="${esc(lane.key)}">${lane.nodes.map((node,index)=>graphNodeHtml(node,index,lane.nodes[index-1],!state.seenNodeIds.has(node.id))).join("")}</div></section>`;
    }
    function bindGraphNodes(nodes){
        $("graph").querySelectorAll("[data-node]").forEach(element=>{
            const node=nodes.find(item=>String(item.id)===element.dataset.node);
            element.onmouseenter=event=>showHoverPreview(node,event.currentTarget);
            element.onmouseleave=hideHoverPreview;
            element.onclick=()=>{if(!state.panMoved)showDetail(node.id)};
        });
    }
    function updateGraphNodeElement(node){
        const element=[...$("graph").querySelectorAll("[data-node]")].find(item=>item.dataset.node===String(node.id));
        if(!element)return;
        element.className=`node ${nodeClass(node)} ${node.id===state.selected?"selected":""}`;
        element.querySelector(".node-kicker").textContent=node.type||"NODE";
        element.querySelector(".node-title").textContent=nodeDisplayTitle(node);
        element.querySelector(".node-sub").textContent=node.loopIndex==null?node.summary||typeCopy[node.type]||"":`Loop ${node.loopIndex} · ${node.summary||typeCopy[node.type]||""}`;
        element.querySelector(".node-status").lastChild.textContent=nodeStatusLabel(node);
    }
    function reconcileLaneNodes(track,lane){
        const nextIds=lane.nodes.map(node=>String(node.id)),currentIds=[...track.querySelectorAll("[data-node]")].map(item=>item.dataset.node),prefix=currentIds.every((id,index)=>nextIds[index]===id);
        if(!prefix)track.innerHTML=lane.nodes.map((node,index)=>graphNodeHtml(node,index,lane.nodes[index-1],!state.seenNodeIds.has(node.id))).join("");
        else{
            lane.nodes.slice(0,currentIds.length).forEach(updateGraphNodeElement);
            for(let index=currentIds.length;index<lane.nodes.length;index++)track.insertAdjacentHTML("beforeend",graphNodeHtml(lane.nodes[index],index,lane.nodes[index-1],true));
        }
    }
    function scheduleLoopConnectorPaths(){
        cancelAnimationFrame(state.connectorFrame||0);
        state.connectorFrame=requestAnimationFrame(renderLoopConnectorPaths);
    }
    function renderLoopConnectorPaths(){
        const graph=$("graph"),lanes=[...graph.querySelectorAll(".execution-lane")];
        if(lanes.length<2){graph.querySelector(".lane-connector-layer")?.remove();return}
        let layer=graph.querySelector(".lane-connector-layer");
        if(!layer){layer=document.createElementNS("http://www.w3.org/2000/svg","svg");layer.setAttribute("class","lane-connector-layer");graph.prepend(layer)}
        const graphRect=graph.getBoundingClientRect(),zoom=state.graphZoom||1,width=Math.max(graph.scrollWidth,graph.clientWidth),height=Math.max(graph.scrollHeight,graph.clientHeight),paths=[];
        lanes.slice(0,-1).forEach((lane,index)=>{
            const from=[...lane.querySelectorAll("[data-node]")].at(-1),to=lanes[index+1].querySelector("[data-node]");
            if(!from||!to)return;
            const fromRect=from.getBoundingClientRect(),toRect=to.getBoundingClientRect(),x1=(fromRect.right-graphRect.left)/zoom,y1=(fromRect.top+fromRect.height/2-graphRect.top)/zoom,x2=(toRect.left-graphRect.left)/zoom,y2=(toRect.top+toRect.height/2-graphRect.top)/zoom,gutter=Math.max(x1,x2)+46;
            paths.push(`<path class="lane-return-path" d="M ${x1} ${y1} C ${gutter} ${y1}, ${gutter} ${y2}, ${x2} ${y2}"/><path class="lane-return-arrow" d="M ${x2-1} ${y2} l -7 -4 l 0 8 z"/>`);
        });
        layer.setAttribute("width",String(width));layer.setAttribute("height",String(height));layer.setAttribute("viewBox",`0 0 ${width} ${height}`);layer.innerHTML=paths.join("");
    }
    function renderGraph(nodes){
        const graph=$("graph"),previousCount=state.lastRenderedNodeCount,freshCount=nodes.filter(node=>!state.seenNodeIds.has(node.id)).length,lanes=AgentObservabilityLogic.groupExecutionLanes(nodes),nextLaneKeys=lanes.map(lane=>lane.key),currentLaneKeys=[...graph.querySelectorAll("[data-lane-key]")].map(item=>item.dataset.laneKey),lanePrefix=currentLaneKeys.every((key,index)=>nextLaneKeys[index]===key);
        if(!nodes.length){graph.innerHTML='<div class="empty">暂无可视化节点</div>';return}
        if(graph.querySelector(".empty")||!lanePrefix)graph.innerHTML=lanes.map(lane=>executionLaneHtml(lane,true)).join("");
        else{
            lanes.slice(0,currentLaneKeys.length).forEach(lane=>{const track=[...graph.querySelectorAll("[data-lane-track]")].find(item=>item.dataset.laneTrack===lane.key);if(track)reconcileLaneNodes(track,lane)});
            lanes.slice(currentLaneKeys.length).forEach(lane=>graph.insertAdjacentHTML("beforeend",executionLaneHtml(lane,true)));
        }
        nodes.forEach(node=>state.seenNodeIds.add(node.id));
        bindGraphNodes(nodes);applyGraphZoom();scheduleLoopConnectorPaths();
        if(state.resetGraphScroll){state.resetGraphScroll=false;requestAnimationFrame(()=>{const scroll=$("graphScroll");scroll.scrollLeft=0;scroll.scrollTop=0})}
        state.lastRenderedNodeCount=nodes.length;
        if(previousCount&&freshCount){if(state.followLatest)requestAnimationFrame(()=>scrollToLatestNode("smooth"));else state.newNodeCount+=freshCount}
        updateFollowControls();
    }
    function updateFollowControls(){const follow=$("followLatest"),indicator=$("newNodeIndicator");if(!follow||!indicator)return;follow.classList.toggle("active",state.followLatest);follow.setAttribute("aria-pressed",String(state.followLatest));follow.textContent=state.followLatest?"正在跟随":"跟随最新";indicator.hidden=!state.newNodeCount||state.followLatest;if(!indicator.hidden)indicator.textContent=`${state.newNodeCount} 个新节点 · 点击跟随`}
    function scrollToLatestNode(behavior="auto"){const latest=[...$("graph").querySelectorAll("[data-node]")].at(-1);latest?.scrollIntoView({behavior,block:"nearest",inline:"center"})}
    function setFollowLatest(enabled){state.followLatest=AgentObservabilityLogic.nextFollowState(state.followLatest,enabled?"FOLLOW_ENABLE":"USER_INSPECT");state.manualPan=!state.followLatest;if(state.followLatest){state.newNodeCount=0;requestAnimationFrame(()=>scrollToLatestNode("smooth"))}updateFollowControls()}
    function suspendFollow(cause){const next=AgentObservabilityLogic.nextFollowState(state.followLatest,cause);if(next===state.followLatest)return;state.followLatest=next;state.manualPan=true;updateFollowControls()}
    function applyGraphZoom(){
        const graph=$("graph");if(!graph)return;
        graph.style.transform=`scale(${state.graphZoom})`;
        $("zoomValue").textContent=`${Math.round(state.graphZoom*100)}%`;
        scheduleLoopConnectorPaths();
    }
    function changeGraphZoom(delta){suspendFollow("USER_ZOOM");state.graphZoom=Math.max(.7,Math.min(1.35,Math.round((state.graphZoom+delta)*20)/20));applyGraphZoom()}
    function resetGraphView(){suspendFollow("USER_ZOOM");state.graphZoom=1;applyGraphZoom();const scroll=$("graphScroll");scroll.scrollTo({left:0,top:0,behavior:"smooth"})}
    function initGraphInteractions(){
        const scroll=$("graphScroll");let pointerId=null,startX=0,startY=0,startLeft=0,startTop=0,dragging=false;
        scroll.addEventListener("pointerdown",event=>{if(event.button!==0)return;pointerId=event.pointerId;startX=event.clientX;startY=event.clientY;startLeft=scroll.scrollLeft;startTop=scroll.scrollTop;dragging=false;state.panMoved=false});
        scroll.addEventListener("pointermove",event=>{if(pointerId!==event.pointerId)return;const deltaX=event.clientX-startX,deltaY=event.clientY-startY;if(!dragging&&Math.hypot(deltaX,deltaY)>3){dragging=true;state.panMoved=true;suspendFollow("USER_PAN");scroll.classList.add("graph-pan");scroll.setPointerCapture(pointerId)}if(!dragging)return;scroll.scrollLeft=startLeft-deltaX;scroll.scrollTop=startTop-deltaY;event.preventDefault()});
        const stop=event=>{if(pointerId!==event.pointerId)return;if(dragging&&scroll.hasPointerCapture?.(pointerId))scroll.releasePointerCapture(pointerId);scroll.classList.remove("graph-pan");pointerId=null;dragging=false;setTimeout(()=>{state.panMoved=false},0)};
        scroll.addEventListener("pointerup",stop);scroll.addEventListener("pointercancel",stop);
        scroll.addEventListener("dragstart",event=>event.preventDefault());
        scroll.addEventListener("wheel",event=>{suspendFollow("USER_PAN");if(!event.shiftKey)return;event.preventDefault();scroll.scrollLeft+=event.deltaY},{passive:false});
        $("zoomControl").querySelectorAll("[data-zoom]").forEach(button=>button.onclick=()=>button.dataset.zoom==="in"?changeGraphZoom(.1):button.dataset.zoom==="out"?changeGraphZoom(-.1):resetGraphView());
        $("followLatest").onclick=()=>setFollowLatest(!state.followLatest);$("newNodeIndicator").onclick=()=>setFollowLatest(true);
        $("expandGraph").onclick=()=>{state.graphExpanded=!state.graphExpanded;$("commandDeck").classList.toggle("graph-expanded",state.graphExpanded);$("expandGraph").classList.toggle("active",state.graphExpanded);$("expandGraph").setAttribute("aria-pressed",String(state.graphExpanded));$("expandGraph").textContent=state.graphExpanded?"↙":"⛶";setTimeout(scheduleLoopConnectorPaths,230)};
        $("detailBody").addEventListener("scroll",()=>suspendFollow("USER_DETAIL_SCROLL"),{passive:true});
        document.addEventListener("selectionchange",()=>{const selection=window.getSelection?.();if(selection&&!selection.isCollapsed&&$("detailBody").contains(selection.anchorNode))suspendFollow("USER_SELECT")});
    }
    function connect(){if(state.source)state.source.close();if(!runId)return;const connectedRunId=runId,last=state.snapshot?.lastSeq||0;state.source=new EventSource(`${api}/agent/runs/${encodeURIComponent(connectedRunId)}/debug/events/stream?lastSeq=${encodeURIComponent(last)}`);state.source.onopen=()=>{if(connectedRunId===runId)scheduleLoad(0)};state.source.addEventListener("agent-debug-event",()=>{if(connectedRunId===runId)scheduleLoad(80)});state.source.addEventListener("agent-debug-heartbeat",()=>{if(connectedRunId===runId&&isLiveSnapshot(state.snapshot))scheduleLoad(0)});state.source.onerror=()=>{state.source?.close();if(connectedRunId===runId)setTimeout(connect,2500)}}
    $("refreshBtn").onclick=()=>scheduleLoad(0);$("closeBtn").onclick=()=>window.close();$("detailClose").onclick=closeDetail;$("detailLayer").onclick=event=>{if(event.target===$("detailLayer"))closeDetail()};$("runExplorerTrigger").onclick=()=>{$("runExplorer").classList.toggle("open");$("runExplorerTrigger").setAttribute("aria-expanded",String($("runExplorer").classList.contains("open")))};document.addEventListener("keydown",event=>{if(event.key==="Escape")closeDetail()});window.showDetail=showDetail;window.renderStructured=renderStructured;window.__agentStudioState=state;window.addEventListener("resize",()=>{hideHoverPreview();scheduleLoopConnectorPaths()});initGraphInteractions();initRunSignalChannel();scheduleLiveRefresh();load().then(connect);
})();
