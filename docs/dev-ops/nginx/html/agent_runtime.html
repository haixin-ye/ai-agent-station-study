<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoAgent Runtime</title>
    <script src="js/marked.min.js"></script>
    <script src="js/purify.min.js"></script>
    <link rel="stylesheet" href="css/github.min.css">
    <style>
        :root {
            --canvas: #f7f4ee;
            --paper: #fffdfa;
            --panel: #efe8dc;
            --panel-strong: #e4dacb;
            --ink: #1d1b18;
            --ink-soft: #514d45;
            --ink-muted: #81786b;
            --line: #ddd2c2;
            --line-strong: #c7b8a5;
            --accent: #9b5b43;
            --green: #487a62;
            --amber: #9a6b2f;
            --red: #a9443d;
            --dark: #1f1d19;
            --dark-soft: #2f2b25;
            --light: #fffaf1;
            --radius: 8px;
            --sidebar-width: 300px;
            --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
            --sans: "Avenir Next", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
            --serif: "Iowan Old Style", "Songti SC", Georgia, serif;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
            color: var(--ink);
            background: var(--canvas);
            font-family: var(--sans);
            letter-spacing: 0;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        .app-shell {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            min-height: 0;
            display: grid;
            grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
            overflow: hidden;
        }

        .sidebar {
            min-width: 0;
            min-height: 0;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            overflow: hidden;
            background: var(--panel);
            border-right: 1px solid var(--line);
        }

        .brand {
            padding: 20px 18px 16px;
            border-bottom: 1px solid var(--line);
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .mark {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border-radius: 6px;
            color: #fff8ed;
            background: var(--dark);
            font-family: var(--serif);
            font-size: 17px;
        }

        .brand-title {
            font-family: var(--serif);
            font-size: 20px;
            line-height: 1.1;
        }

        .brand-subtitle {
            margin-top: 2px;
            color: var(--ink-muted);
            font-size: 12px;
        }

        .mode-switch {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            padding: 4px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--panel-strong);
        }

        .mode-button {
            height: 32px;
            border-radius: 6px;
            color: var(--ink-muted);
            background: transparent;
            font-size: 13px;
            font-weight: 650;
        }

        .mode-button.active {
            color: var(--ink);
            background: var(--paper);
            box-shadow: 0 1px 0 rgba(29, 27, 24, 0.06);
        }

        .sidebar-scroll {
            min-height: 0;
            overflow-y: auto;
            padding: 14px;
        }

        .sidebar-section + .sidebar-section {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
        }

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 0 6px 10px;
        }

        .section-label {
            color: var(--ink-muted);
            font-size: 12px;
            font-weight: 700;
        }

        .session-list,
        .scenario-list {
            display: grid;
            gap: 6px;
        }

        .session-item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 30px;
            gap: 4px;
            align-items: stretch;
            border-radius: var(--radius);
        }

        .session-button,
        .scenario-button {
            width: 100%;
            min-width: 0;
            padding: 11px 12px;
            border-radius: var(--radius);
            color: var(--ink);
            background: transparent;
            text-align: left;
        }

        .session-button:hover,
        .scenario-button:hover,
        .session-item.active .session-button,
        .scenario-button.active {
            background: rgba(255, 253, 250, 0.78);
        }

        .delete-session {
            width: 30px;
            border-radius: 7px;
            color: var(--ink-muted);
            background: transparent;
            font-size: 16px;
        }

        .delete-session:hover {
            color: #fff;
            background: var(--red);
        }

        .session-title,
        .scenario-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
            font-weight: 700;
        }

        .session-meta,
        .scenario-desc {
            margin-top: 4px;
            color: var(--ink-muted);
            font-size: 12px;
            line-height: 1.4;
        }

        .sidebar-footer {
            padding: 12px 18px 16px;
            border-top: 1px solid var(--line);
            color: var(--ink-muted);
            font-size: 12px;
            line-height: 1.55;
        }

        .api-line {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: var(--mono);
            font-size: 11px;
        }

        .main {
            min-width: 0;
            min-height: 0;
            height: 100vh;
            height: 100dvh;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            overflow: hidden;
            background: var(--paper);
        }

        .topbar {
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 0 22px;
            border-bottom: 1px solid var(--line);
            background: rgba(255, 253, 250, 0.94);
        }

        .run-title {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-pill {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: 28px;
            padding: 0 10px;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--ink-soft);
            background: var(--canvas);
            font-size: 12px;
            white-space: nowrap;
        }

        .status-pill::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--ink-muted);
        }

        .status-pill.running::before {
            background: var(--amber);
        }

        .status-pill.completed::before {
            background: var(--green);
        }

        .status-pill.failed::before {
            background: var(--red);
        }

        .run-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 750;
        }

        .run-id {
            margin-top: 2px;
            max-width: 50vw;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--ink-muted);
            font-family: var(--mono);
            font-size: 12px;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ghost-button,
        .primary-button {
            height: 34px;
            padding: 0 13px;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 700;
        }

        .ghost-button {
            color: var(--ink-soft);
            background: transparent;
            border: 1px solid var(--line);
        }

        .ghost-button:hover {
            background: var(--canvas);
            border-color: var(--line-strong);
        }

        .primary-button {
            color: #fff;
            background: var(--dark);
        }

        .chat-scroll {
            min-height: 0;
            overflow-y: auto;
            padding: 26px 20px 22px;
        }

        .chat-inner {
            width: min(880px, 100%);
            margin: 0 auto;
        }

        .empty-state {
            display: grid;
            gap: 20px;
            padding: 48px 0 24px;
        }

        .empty-heading {
            max-width: 720px;
            font-family: var(--serif);
            font-size: 38px;
            line-height: 1.14;
            font-weight: 400;
        }

        .empty-copy {
            max-width: 680px;
            color: var(--ink-soft);
            font-size: 15px;
            line-height: 1.7;
        }

        .starter-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .starter-button {
            min-height: 76px;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            color: var(--ink);
            background: var(--canvas);
            text-align: left;
        }

        .starter-button:hover {
            border-color: var(--line-strong);
            background: var(--light);
        }

        .starter-button strong {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
        }

        .starter-button span {
            color: var(--ink-muted);
            font-size: 12px;
            line-height: 1.45;
        }

        .message-stack {
            display: grid;
            gap: 20px;
        }

        .message {
            display: grid;
            grid-template-columns: 34px minmax(0, 1fr);
            gap: 13px;
            align-items: start;
        }

        .avatar {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            color: #fff8ed;
            background: var(--dark);
            font-family: var(--serif);
            font-size: 15px;
        }

        .message.user .avatar {
            color: var(--ink);
            background: var(--panel-strong);
        }

        .bubble {
            max-width: 100%;
            padding-top: 5px;
            color: var(--ink);
            font-size: 15px;
            line-height: 1.72;
            overflow-wrap: anywhere;
        }

        .message.user .bubble {
            width: fit-content;
            max-width: min(720px, 100%);
            padding: 12px 15px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--canvas);
        }

        .bubble p {
            margin: 0 0 12px;
        }

        .bubble p:last-child {
            margin-bottom: 0;
        }

        .event-line {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 7px 0 7px 47px;
            color: var(--ink-muted);
            font-size: 13px;
            line-height: 1.45;
        }

        .event-marker {
            width: 8px;
            height: 8px;
            margin-top: 6px;
            border-radius: 50%;
            background: var(--line-strong);
        }

        .event-line.running .event-marker {
            background: var(--amber);
        }

        .event-line.completed .event-marker {
            background: var(--green);
        }

        .event-line.failed .event-marker {
            background: var(--red);
        }

        .event-title {
            color: var(--ink-soft);
            font-weight: 750;
        }

        .pending-card,
        .artifact-card {
            margin-left: 47px;
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--canvas);
        }

        .pending-title,
        .artifact-title {
            margin: 0 0 8px;
            font-size: 14px;
            font-weight: 750;
        }

        .pending-question,
        .artifact-summary {
            margin: 0 0 14px;
            color: var(--ink-soft);
            font-size: 13px;
            line-height: 1.55;
        }

        .pending-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .option-button {
            min-height: 34px;
            padding: 7px 11px;
            border: 1px solid var(--line-strong);
            border-radius: var(--radius);
            color: var(--ink);
            background: var(--paper);
            font-size: 13px;
            font-weight: 700;
        }

        .option-button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .free-answer {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 8px;
            margin-top: 10px;
        }

        .free-answer input {
            min-width: 0;
            height: 34px;
            padding: 0 10px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            outline: none;
            color: var(--ink);
            background: var(--paper);
        }

        .composer-wrap {
            padding: 14px 20px 18px;
            border-top: 1px solid var(--line);
            background: rgba(255, 253, 250, 0.96);
        }

        .composer {
            width: min(880px, 100%);
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 46px;
            gap: 10px;
            align-items: end;
        }

        .composer textarea {
            min-width: 0;
            min-height: 52px;
            max-height: 150px;
            resize: none;
            padding: 14px 15px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            outline: none;
            color: var(--ink);
            background: var(--canvas);
            line-height: 1.5;
        }

        .composer textarea:focus {
            border-color: var(--accent);
            background: var(--paper);
        }

        .send-button {
            width: 46px;
            height: 46px;
            border-radius: var(--radius);
            color: #fff;
            background: var(--dark);
            font-size: 18px;
            line-height: 1;
        }

        .send-button:disabled {
            cursor: not-allowed;
            color: var(--ink-muted);
            background: var(--panel-strong);
        }

        .drawer-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 30;
            background: rgba(29, 27, 24, 0.18);
        }

        .drawer-backdrop.open {
            display: block;
        }

        .drawer {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 40;
            width: min(410px, 100vw);
            height: 100vh;
            height: 100dvh;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            transform: translateX(100%);
            transition: transform 180ms ease;
            color: #f7f0e6;
            background: var(--dark);
            border-left: 1px solid #3a372f;
        }

        .drawer.open {
            transform: translateX(0);
        }

        .drawer-header {
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            border-bottom: 1px solid #373229;
        }

        .drawer-content {
            min-height: 0;
            overflow-y: auto;
            padding: 16px;
        }

        .debug-section {
            padding: 14px 0;
            border-bottom: 1px solid #373229;
        }

        .debug-section h3 {
            margin: 0 0 10px;
            color: #d7cabc;
            font-size: 12px;
        }

        .debug-kv {
            display: grid;
            grid-template-columns: 92px minmax(0, 1fr);
            gap: 8px;
            padding: 5px 0;
            font-family: var(--mono);
            font-size: 12px;
        }

        .debug-kv span:first-child {
            color: #928778;
        }

        .debug-kv span:last-child {
            overflow-wrap: anywhere;
        }

        .debug-list {
            display: grid;
            gap: 8px;
        }

        .debug-event {
            padding: 9px 10px;
            border: 1px solid #3b362e;
            border-radius: 6px;
            background: #28241e;
            font-size: 12px;
            line-height: 1.45;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            z-index: 60;
            transform: translateX(-50%) translateY(18px);
            opacity: 0;
            pointer-events: none;
            padding: 10px 13px;
            border-radius: var(--radius);
            color: #fff8ed;
            background: var(--dark);
            font-size: 13px;
            transition: opacity 160ms ease, transform 160ms ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 920px) {
            .app-shell {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }

            .topbar {
                padding: 0 14px;
            }

            .empty-heading {
                font-size: 32px;
            }

            .starter-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 620px) {
            .composer {
                grid-template-columns: 1fr;
            }

            .send-button {
                width: 100%;
            }

            .message {
                grid-template-columns: 28px minmax(0, 1fr);
            }

            .avatar {
                width: 28px;
                height: 28px;
            }

            .event-line,
            .pending-card,
            .artifact-card {
                margin-left: 38px;
                padding-left: 0;
            }
        }
    </style>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-row">
                <div class="mark">A</div>
                <div>
                    <div class="brand-title">AutoAgent</div>
                    <div class="brand-subtitle">Runtime Chat</div>
                </div>
            </div>
            <div class="mode-switch" aria-label="mode switch">
                <button id="mockModeBtn" class="mode-button" type="button">Mock</button>
                <button id="realModeBtn" class="mode-button" type="button">Real</button>
            </div>
        </div>

        <div class="sidebar-scroll">
            <section class="sidebar-section">
                <div class="section-head">
                    <span class="section-label">会话</span>
                    <button id="newChatSmallBtn" class="ghost-button" type="button">New</button>
                </div>
                <div id="sessionList" class="session-list"></div>
            </section>

            <section class="sidebar-section">
                <div class="section-head">
                    <span class="section-label">Mock 场景</span>
                </div>
                <div id="scenarioList" class="scenario-list"></div>
            </section>
        </div>

        <div class="sidebar-footer">
            <div id="connectionText">Real API mode</div>
            <div id="apiLine" class="api-line"></div>
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <div class="run-title">
                <span id="statusPill" class="status-pill">idle</span>
                <div>
                    <div id="activeTitle" class="run-name">新会话</div>
                    <div id="activeRunId" class="run-id">no active run</div>
                </div>
            </div>
            <div class="top-actions">
                <button id="newChatBtn" class="ghost-button" type="button">New</button>
                <button id="debugBtn" class="ghost-button" type="button">Debug</button>
            </div>
        </header>

        <section id="chatScroll" class="chat-scroll">
            <div class="chat-inner">
                <div id="emptyState" class="empty-state">
                    <div>
                        <div class="empty-heading">把问题交给智能体，过程保持安静，结果保持干净。</div>
                        <p class="empty-copy">普通视图只显示会话、必要进度、用户确认和最终回答。调试信息会保存在独立抽屉里，避免把内部流程误当成回答。</p>
                    </div>
                    <div class="starter-grid">
                        <button class="starter-button" data-starter="帮我生成一篇 RAG 相关的八股文，200 字左右">
                            <strong>生成短文</strong>
                            <span>检查普通最终回答是否干净。</span>
                        </button>
                        <button class="starter-button" data-starter="把上一篇文章发布到 CSDN，发布前请让我确认">
                            <strong>工具确认</strong>
                            <span>检查等待用户确认的交互。</span>
                        </button>
                        <button class="starter-button" data-starter="根据知识库解释 RAG 和 MCP 的区别">
                            <strong>知识检索</strong>
                            <span>检查检索过程的展示。</span>
                        </button>
                        <button class="starter-button" data-starter="把刚才的文章结构重新整理一下">
                            <strong>引用产物</strong>
                            <span>检查上下文与产物选择。</span>
                        </button>
                    </div>
                </div>
                <div id="messageStack" class="message-stack"></div>
            </div>
        </section>

        <footer class="composer-wrap">
            <div class="composer">
                <textarea id="messageInput" placeholder="输入消息" rows="2"></textarea>
                <button id="sendBtn" class="send-button" type="button" aria-label="发送">↑</button>
            </div>
        </footer>
    </main>
</div>

<div id="drawerBackdrop" class="drawer-backdrop"></div>
<aside id="debugDrawer" class="drawer" aria-hidden="true">
    <div class="drawer-header">
        <div class="drawer-title">Debug</div>
        <button id="closeDebugBtn" class="ghost-button" type="button">Close</button>
    </div>
    <div class="drawer-content">
        <section class="debug-section">
            <h3>Run</h3>
            <div class="debug-kv"><span>session</span><span id="debugSessionId">-</span></div>
            <div class="debug-kv"><span>run</span><span id="debugRunId">-</span></div>
            <div class="debug-kv"><span>status</span><span id="debugStatus">idle</span></div>
            <div class="debug-kv"><span>mode</span><span id="debugMode">real</span></div>
            <div class="debug-kv"><span>api</span><span id="debugApiBase">-</span></div>
        </section>
        <section class="debug-section">
            <h3>Events</h3>
            <div id="debugEvents" class="debug-list"></div>
        </section>
        <section class="debug-section">
            <h3>Artifacts</h3>
            <div id="debugArtifacts" class="debug-list"></div>
        </section>
    </div>
</aside>
<div id="toast" class="toast"></div>

<script>
    const params = new URLSearchParams(window.location.search);
    const defaultApiBase = window.location.port === "8091" ? "" : "http://127.0.0.1:8091";
    const API_BASE = params.get("api") || localStorage.getItem("autoAgentRuntimeApiBase") || defaultApiBase;
    const STORE_KEY = "autoAgentRuntimeUi:v2";

    const fallbackScenarios = [
        {scenario: "simple_final", title: "直接回答", description: "短回答流程。"},
        {scenario: "rag_progress", title: "知识检索", description: "检索知识后生成回答。"},
        {scenario: "tool_publish_progress", title: "工具确认", description: "发布前请求确认。"},

    function unwrap(response) {
        if (!response) return null;
        if (Object.prototype.hasOwnProperty.call(response, "code")) {
            if (response.code !== "0000") {
                throw new Error(response.info || "request failed");
            }
            return response.data;
        }
        return response;
    }

    async function requestJson(url, options = {}) {
        const response = await fetch(API_BASE + url, {
            headers: {"Content-Type": "application/json", ...(options.headers || {})},
            ...options
        });
        if (!response.ok) {
            throw new Error(`${response.status} ${response.statusText}`);
        }
        return unwrap(await response.json());
    }

    function loadState() {
        try {
            const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
            state.mode = params.get("mode") || saved.mode || "real";
            state.sessions = Array.isArray(saved.sessions) ? saved.sessions : [];
            state.activeSessionId = saved.activeSessionId || null;
        } catch (error) {
            state.sessions = [];
        }
        if (!state.sessions.length) {
            createSession("默认会话", false);
        }
        if (!state.activeSessionId) {
            state.activeSessionId = state.sessions[0].sessionId;
        }
    }

    function persistState() {
        localStorage.setItem(STORE_KEY, JSON.stringify({
            mode: state.mode,
            sessions: state.sessions,
            activeSessionId: state.activeSessionId
        }));
    }

    function createSession(title = "新会话", activate = true) {
        const session = {
            sessionId: `sess-ui-${Date.now()}-${Math.random().toString(16).slice(2, 8)}`,
            title,
            createdAt: new Date().toISOString(),
            messages: []
        };
        state.sessions.unshift(session);
        if (activate) {
            state.activeSessionId = session.sessionId;
            state.activeRunId = null;
            state.status = "idle";
            resetRunViewState();
        }
        persistState();
        return session;
    }

    function deleteSession(sessionId) {
        const index = state.sessions.findIndex(item => item.sessionId === sessionId);
        if (index < 0) return;
        state.sessions.splice(index, 1);
        if (!state.sessions.length) {
            createSession("默认会话", false);
        }
        if (state.activeSessionId === sessionId) {
            closeStream();
            state.activeSessionId = state.sessions[0].sessionId;
            state.activeRunId = null;
            state.status = "idle";
            resetRunViewState();
        }
        persistState();
        renderAll();
    }

    function activeSession() {
        return state.sessions.find(item => item.sessionId === state.activeSessionId) || state.sessions[0];
    }

    function resetRunViewState() {
        state.events = [];
        state.artifacts = [];
        state.pendingInputs = new Map();
        state.answeredPendingIds = new Set();
        state.seenEventKeys = new Set();
    }

    function setMode(mode) {
        state.mode = mode;
        els.mockModeBtn.classList.toggle("active", mode === "mock");
        els.realModeBtn.classList.toggle("active", mode === "real");
        els.connectionText.textContent = mode === "mock" ? "Mock mode" : "Real API mode";
        els.apiLine.textContent = mode === "real" ? `API ${API_BASE || location.origin}` : "Local mock scenarios";
        persistState();
        renderDebug();
    }

    function setStatus(status) {
        state.status = status || "idle";
        els.statusPill.textContent = state.status;
        els.statusPill.className = `status-pill ${statusClass(state.status)}`;
        renderDebug();
    }

    function statusClass(status) {
        const value = String(status || "").toLowerCase();
        if (value.includes("complete") || value.includes("final")) return "completed";
        if (value.includes("fail") || value.includes("error")) return "failed";
        if (value === "idle") return "";
        return "running";
    }

    function addMessage(role, content, meta = {}) {
        const session = activeSession();
        const message = {
            id: `msg-${Date.now()}-${Math.random().toString(16).slice(2, 8)}`,
            role,
            content,
            meta,
            createdAt: new Date().toISOString()
        };
        session.messages.push(message);
        if (role === "user" && session.messages.filter(item => item.role === "user").length === 1) {
            session.title = content.slice(0, 22) || "新会话";
        }
        persistState();
        renderMessages();
        renderSessions();
        return message;
    }

    function addEvent(event) {
        const normalized = {
            eventId: event.eventId || `evt-${Date.now()}-${Math.random().toString(16).slice(2, 8)}`,
            runId: event.runId || state.activeRunId,
            seq: event.seq || state.events.length + 1,
            eventType: event.eventType || "STATUS_CHANGED",
            title: event.title || event.phase || event.status || "运行中",
            message: event.message || event.summary || "",
            artifactId: event.artifactId || null,
            pendingId: event.pendingId || event.pendingInputId || null,
            safePayload: event.safePayload || {},
            createdAt: event.createdAt || new Date().toISOString()
        };
        const eventKey = event.eventId ? `id:${event.eventId}` : `seq:${normalized.runId}:${normalized.seq}`;
        if (state.seenEventKeys.has(eventKey)) return;
        state.seenEventKeys.add(eventKey);
        state.events.push(normalized);

        if (normalized.pendingId) {
            ensurePendingInput(normalized.pendingId);
        }
        if (normalized.artifactId && !state.artifacts.find(item => item.artifactId === normalized.artifactId)) {
            state.artifacts.push({
                artifactId: normalized.artifactId,
                title: "生成产物",
                summary: normalized.message || "产物已生成。"
            });
        }
        if (normalized.eventType === "FINAL_READY") {
            setStatus("completed");
            addFinalForScenario();
        } else if (normalized.eventType === "RUN_FAILED") {
            setStatus("failed");
        } else if (normalized.pendingId) {
            setStatus("waiting_user");
        } else {
            setStatus(normalized.title || "running");
        }
        renderMessages();
        renderDebug();
    }

    async function addFinalForScenario() {
        if (state.mode === "mock" || String(state.activeRunId || "").startsWith("mock-")) {
            const scenario = state.activeScenario || "simple_final";
            addAssistantFinal(finalMessages[scenario] || finalMessages.simple_final);
            return;
        }
        try {
            const result = await requestJson(`/agent/runs/${encodeURIComponent(state.activeRunId)}/final`);
            if (result?.finalAnswer) {
                addAssistantFinal(result.finalAnswer);
            }
        } catch (error) {
            toast(`最终回答读取失败：${error.message}`);
        }
    }

    function addAssistantFinal(text) {
        const session = activeSession();
        const last = session.messages[session.messages.length - 1];
        if (!last || last.role !== "assistant" || last.meta.runId !== state.activeRunId) {
            addMessage("assistant", text, {runId: state.activeRunId, final: true});
        }
    }

    function ensurePendingInput(pendingId) {
        if (state.pendingInputs.has(pendingId)) return;
        if (state.mode === "mock" || String(state.activeRunId || "").startsWith("mock-")) {
            const pending = mockPendingInputs[pendingId];
            if (pending) state.pendingInputs.set(pendingId, pending);
            return;
        }
        requestJson(`/agent/runs/${encodeURIComponent(state.activeRunId)}/pending-input`)
            .then(pending => {
                if (pending?.pendingId) {
                    state.pendingInputs.set(pending.pendingId, pending);
                    renderMessages();
                }
            })
            .catch(error => toast(`用户确认加载失败：${error.message}`));
    }

    function renderSessions() {
        els.sessionList.innerHTML = "";
        state.sessions.forEach(session => {
            const item = document.createElement("div");
            item.className = `session-item ${session.sessionId === state.activeSessionId ? "active" : ""}`;
            const button = document.createElement("button");
            button.type = "button";
            button.className = "session-button";
            button.innerHTML = `
                <div class="session-title">${escapeHtml(session.title || "新会话")}</div>
                <div class="session-meta">${escapeHtml(formatTime(session.createdAt))}</div>
            `;
            button.addEventListener("click", () => {
                state.activeSessionId = session.sessionId;
                state.activeRunId = null;
                setStatus("idle");
                resetRunViewState();
                persistState();
                renderAll();
            });
            const del = document.createElement("button");
            del.type = "button";
            del.className = "delete-session";
            del.title = "删除会话";
            del.textContent = "×";
            del.addEventListener("click", event => {
                event.stopPropagation();
                deleteSession(session.sessionId);
            });
            item.appendChild(button);
            item.appendChild(del);
            els.sessionList.appendChild(item);
        });
    }

    function renderMessages() {
        const session = activeSession();
        els.emptyState.classList.toggle("hidden", Boolean(session.messages.length || state.events.length));
        els.messageStack.innerHTML = "";
        session.messages.forEach(message => els.messageStack.appendChild(renderMessage(message)));
        state.events.forEach(event => {
            els.messageStack.appendChild(renderEvent(event));
            if (event.pendingId && isPendingActive(event.pendingId)) {
                els.messageStack.appendChild(renderPending(event.pendingId));
            }
            if (event.artifactId) {
                els.messageStack.appendChild(renderArtifact(event.artifactId, event.message));
            }
        });
        queueMicrotask(() => {
            els.chatScroll.scrollTop = els.chatScroll.scrollHeight;
        });
    }

    function renderMessage(message) {
        const wrapper = document.createElement("article");
        wrapper.className = `message ${message.role}`;
        wrapper.innerHTML = `
            <div class="avatar">${message.role === "user" ? "你" : "A"}</div>
            <div class="bubble">${renderMarkdown(message.content)}</div>
        `;
        return wrapper;
    }

    function renderEvent(event) {
        const status = event.eventType === "FINAL_READY" ? "completed" : event.eventType === "RUN_FAILED" ? "failed" : "running";
        const wrapper = document.createElement("div");
        wrapper.className = `event-line ${status}`;
        wrapper.innerHTML = `
            <span class="event-marker"></span>
            <div>
                <div class="event-title">${escapeHtml(displayEventTitle(event))}</div>
                ${displayEventMessage(event) ? `<div>${escapeHtml(displayEventMessage(event))}</div>` : ""}
            </div>
        `;
        return wrapper;
    }

    function renderPending(pendingId) {
        const pending = state.pendingInputs.get(pendingId) || mockPendingInputs[pendingId] || {
            pendingId,
            pendingType: "CLARIFICATION",
            inputMode: "SINGLE_CHOICE_OR_FREE_TEXT",
            allowFreeText: true,
            question: "需要你的确认后继续。",
            options: []
        };
        const card = document.createElement("section");
        card.className = "pending-card";
        card.innerHTML = `
            <h3 class="pending-title">需要你确认</h3>
            <p class="pending-question">${escapeHtml(pending.question || "请选择下一步。")}</p>
            <div class="pending-options"></div>
        `;
        const options = card.querySelector(".pending-options");
        (pending.options || []).forEach(option => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "option-button";
            button.textContent = option.label || option.optionId;
            button.title = option.description || "";
            button.addEventListener("click", () => submitPendingAnswer(pending.pendingId, option.optionId, null));
            options.appendChild(button);
        });
        if (pending.allowFreeText || pending.inputMode === "FREE_TEXT" || pending.inputMode === "SINGLE_CHOICE_OR_FREE_TEXT") {
            const free = document.createElement("div");
            free.className = "free-answer";
            free.innerHTML = `
                <input type="text" placeholder="也可以直接输入回答">
                <button class="option-button" type="button">提交</button>
            `;
            const input = free.querySelector("input");
            free.querySelector("button").addEventListener("click", () => submitPendingAnswer(pending.pendingId, null, input.value.trim()));
            input.addEventListener("keydown", event => {
                if (event.key === "Enter") {
                    submitPendingAnswer(pending.pendingId, null, input.value.trim());
                }
            });
            card.appendChild(free);
        }
        return card;
    }

    function renderArtifact(artifactId, summary) {
        const card = document.createElement("section");
        card.className = "artifact-card";
        card.innerHTML = `
            <h3 class="artifact-title">产物已生成</h3>
            <p class="artifact-summary">${escapeHtml(summary || artifactId)}</p>
            <button class="option-button" type="button">查看内容</button>
        `;
        card.querySelector("button").addEventListener("click", () => openArtifact(artifactId));
        return card;
    }

    function renderScenarios(scenarios) {
        els.scenarioList.innerHTML = "";
        scenarios.forEach(item => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = `scenario-button ${state.activeScenario === item.scenario ? "active" : ""}`;
            button.innerHTML = `
                <div class="scenario-title">${escapeHtml(item.title || item.scenario)}</div>
                <div class="scenario-desc">${escapeHtml(item.description || "")}</div>
            `;
            button.addEventListener("click", () => runMockScenario(item.scenario));
            els.scenarioList.appendChild(button);
        });
    }

    function renderTopbar() {
        const session = activeSession();
        els.activeTitle.textContent = session?.title || "新会话";
        els.activeRunId.textContent = state.activeRunId || "no active run";
        els.connectionText.textContent = state.mode === "mock" ? "Mock mode" : "Real API mode";
        els.apiLine.textContent = state.mode === "real" ? `API ${API_BASE || location.origin}` : "Local mock scenarios";
    }

    function renderDebug() {
        els.debugSessionId.textContent = state.activeSessionId || "-";
        els.debugRunId.textContent = state.activeRunId || "-";
        els.debugStatus.textContent = state.status || "idle";
        els.debugMode.textContent = state.mode;
        els.debugApiBase.textContent = API_BASE || location.origin;
        els.debugEvents.innerHTML = state.events.length ? state.events.map(event => `
            <div class="debug-event">
                <code>#${escapeHtml(String(event.seq))}</code> ${escapeHtml(event.eventType)}<br>
                ${escapeHtml(displayEventTitle(event))}
            </div>
        `).join("") : '<div class="debug-event">No event</div>';
        els.debugArtifacts.innerHTML = state.artifacts.length ? state.artifacts.map(artifact => `
            <div class="debug-event">
                <code>${escapeHtml(artifact.artifactId)}</code><br>
                ${escapeHtml(artifact.summary || artifact.title || "")}
            </div>
        `).join("") : '<div class="debug-event">No artifact</div>';
    }

    function renderAll() {
        renderSessions();
        renderTopbar();
        renderMessages();
        renderDebug();
    }

    async function loadScenarios() {
        if (state.mode !== "mock") {
            renderScenarios(fallbackScenarios);
            return;
        }
        try {
            const scenarios = await requestJson("/mock/agent/scenarios");
            renderScenarios(scenarios || fallbackScenarios);
        } catch (error) {
            renderScenarios(fallbackScenarios);
        }
    }

    async function sendMessage() {
        const content = els.messageInput.value.trim();
        if (!content) return;
        els.messageInput.value = "";
        closeStream();
        resetRunViewState();
        addMessage("user", content);
        setStatus("starting");

        if (state.mode === "mock") {
            await runMockScenarioFromMessage(inferScenario(content));
            return;
        }

        try {
            const session = activeSession();
            const result = await requestJson("/agent/chat", {
                method: "POST",
                body: JSON.stringify({
                    sessionId: session.sessionId,
                    agentId: "default",
                    userId: "ui-user",
                    content,
                    inputType: "TEXT",
                    metadata: {source: "agent_runtime_html"}
                })
            });
            state.activeRunId = result.runId;
            setStatus(result.status || "running");
            renderTopbar();
            connectSse(`/agent/runs/${encodeURIComponent(result.runId)}/events/stream`);
        } catch (error) {
            setStatus("failed");
            toast(`后端请求失败：${error.message}`);
        }
    }

    async function runMockScenario(scenario) {
        closeStream();
        setMode("mock");
        state.activeScenario = scenario;
        resetRunViewState();
        addMessage("user", scenarioPrompt(scenario));
        setStatus("starting");
        await runMockScenarioFromMessage(scenario);
    }

    async function runMockScenarioFromMessage(scenario) {
        state.activeScenario = scenario;
        state.activeRunId = `mock-${scenario}-${Date.now()}`;
        renderTopbar();
        fallbackMockEvents(scenario, state.activeRunId).forEach((event, index) => {
            window.setTimeout(() => addEvent(event), 260 * (index + 1));
        });
    }

    function connectSse(path) {
        closeStream();
        const source = new EventSource(API_BASE + withLastSeq(path));
        state.eventSource = source;
        source.addEventListener("agent-event", event => {
            try {
                addEvent(JSON.parse(event.data));
            } catch (error) {
                toast("事件解析失败");
            }
        });
        source.onerror = () => {
            if (state.status !== "completed" && state.status !== "failed") {
                toast("事件流已断开");
            }
            closeStream();
        };
    }

    function closeStream() {
        if (state.eventSource) {
            state.eventSource.close();
            state.eventSource = null;
        }
    }

    function withLastSeq(path) {
        const lastSeq = state.events.reduce((max, event) => Math.max(max, Number(event.seq || 0)), 0);
        if (!lastSeq) return path;
        return `${path}${path.includes("?") ? "&" : "?"}lastSeq=${encodeURIComponent(lastSeq)}`;
    }

    async function submitPendingAnswer(pendingId, optionId, freeText) {
        if (!optionId && !freeText) {
            toast("请输入回答");
            return;
        }
        state.answeredPendingIds.add(pendingId);
        addMessage("user", optionId ? `选择：${optionId}` : freeText, {pendingId});

        if (state.mode === "mock" || !state.activeRunId || state.activeRunId.startsWith("mock-")) {
            setStatus("running");
            window.setTimeout(() => addEvent({
                eventType: "STATUS_CHANGED",
                title: "继续处理",
                message: "已收到你的回复。",
                runId: state.activeRunId
            }), 220);
            window.setTimeout(() => addEvent({
                eventType: "FINAL_READY",
                title: "completed",
                message: "Final response is ready.",
                runId: state.activeRunId
            }), 580);
            return;
        }

        try {
            const result = await requestJson(`/agent/runs/${encodeURIComponent(state.activeRunId)}/user-input`, {
                method: "POST",
                body: JSON.stringify({pendingId, optionId, freeText, cancelled: false, metadata: {source: "agent_runtime_html"}})
            });
            setStatus(result.status || "running");
            connectSse(`/agent/runs/${encodeURIComponent(state.activeRunId)}/events/stream`);
        } catch (error) {
            toast(`提交失败：${error.message}`);
        }
    }

    async function openArtifact(artifactId) {
        if (state.mode === "mock" || artifactId.startsWith("artifact-mock")) {
            addMessage("assistant", `产物 ${artifactId} 已生成。当前 mock 模式不加载完整正文。`, {artifactId});
            return;
        }
        try {
            const artifact = await requestJson(`/agent/artifacts/${encodeURIComponent(artifactId)}`);
            addMessage("assistant", artifact.content || artifact.summary || "产物暂无内容。", {artifactId});
        } catch (error) {
            toast(`产物读取失败：${error.message}`);
        }
    }

    function fallbackMockEvents(scenario, runId) {
        const event = (seq, eventType, title, message, artifactId, pendingId) => ({
            eventId: `local-${runId}-${seq}`,
            runId,
            seq,
            eventType,
            title,
            message,
            artifactId,
            pendingId
        });
        switch (scenario) {
            case "rag_progress":
                return [
                    event(1, "STATUS_CHANGED", "received", "Request received."),
                    event(2, "STATUS_CHANGED", "rag_retrieving", "Searching knowledge base."),
                    event(3, "FINAL_READY", "completed", "Final response is ready.")
                ];
            case "tool_publish_progress":
                return [event(1, "ASK_USER", "asking_user", "Confirm publishing this article?", null, "pending-mock-approve")];
            case "ask_user_choose_artifact":
                return [event(1, "ASK_USER", "asking_user", "Which artifact should I use?", null, "pending-mock-artifact")];
            case "artifact_created":
                return [
                    event(1, "STATUS_CHANGED", "composing", "Creating artifact."),
                    event(2, "STATUS_CHANGED", "artifact_created", "Artifact created.", "artifact-mock-001")
                ];
            case "tool_failed":
                return [
                    event(1, "STATUS_CHANGED", "tool_calling", "Calling tool."),
                    event(2, "RUN_FAILED", "failed", "Tool execution failed safely.")
                ];
            case "context_over_budget":
                return [
                    event(1, "STATUS_CHANGED", "context_over_budget", "Context is too large; asking for a narrower choice."),
                    event(2, "ASK_USER", "asking_user", "Please choose the material range.", null, "pending-mock-context")
                ];
            default:
                return [
                    event(1, "STATUS_CHANGED", "received", "Request received."),
                    event(2, "FINAL_READY", "completed", "Final response is ready.")
                ];
        }
    }

    function inferScenario(text) {
        const value = text.toLowerCase();
        if (value.includes("发布") || value.includes("csdn") || value.includes("工具")) return "tool_publish_progress";
        if (value.includes("知识库") || value.includes("rag") || value.includes("检索")) return "rag_progress";
        if (value.includes("上一篇") || value.includes("刚才") || value.includes("产物")) return "ask_user_choose_artifact";
        if (value.includes("结构") || value.includes("整理")) return "artifact_created";
        return "simple_final";
    }

    function scenarioPrompt(scenario) {
        const prompts = {
            simple_final: "帮我生成一篇 RAG 相关的八股文，200 字左右",
            rag_progress: "根据知识库解释 RAG 的核心流程",
            tool_publish_progress: "把这篇文章发布到 CSDN，发布前让我确认",
            ask_user_choose_artifact: "把刚才那篇文章重新整理一下",
            artifact_created: "创建一篇结构化文章产物",
            tool_failed: "模拟一次工具调用失败",
            context_over_budget: "模拟上下文过大的选择流程"
        };
        return prompts[scenario] || prompts.simple_final;
    }

    function displayEventTitle(event) {
        const title = event.title || event.phase || event.status || event.eventType;
        const map = {
            received: "已接收",
            rag_retrieving: "正在检索",
            composing: "正在组织回答",
            asking_user: "等待确认",
            tool_calling: "正在调用工具",
            artifact_created: "产物已生成",
            context_over_budget: "需要缩小范围",
            completed: "已完成",
            failed: "已停止",
            "STATUS_CHANGED": "运行中",
            "ASK_USER": "等待确认",
            "FINAL_READY": "已完成",
            "RUN_FAILED": "已停止"
        };
        return map[title] || map[String(title).toLowerCase()] || title;
    }

    function displayEventMessage(event) {
        const text = String(event.message || event.summary || "");
        const map = {
            "Request received.": "",
            "Searching knowledge base.": "正在查找相关知识。",
            "Final response is ready.": "",
            "Confirm publishing this article?": "",
            "Which artifact should I use?": "",
            "Creating artifact.": "正在生成可复用内容。",
            "Artifact created.": "",
            "Calling tool.": "正在执行工具操作。",
            "Tool execution failed safely.": "工具执行失败，流程已停止。",
            "Context is too large; asking for a narrower choice.": "可用上下文较多，需要先缩小范围。",
            "Please choose the material range.": ""
        };
        return map[text] ?? text;
    }

    function isPendingActive(pendingId) {
        if (state.answeredPendingIds.has(pendingId)) return false;
        const index = state.events.findIndex(event => event.pendingId === pendingId);
        if (index < 0) return false;
        return !state.events.slice(index + 1).some(event => event.eventType === "FINAL_READY" || event.eventType === "RUN_FAILED");
    }

    function renderMarkdown(content) {
        const raw = String(content || "");
        if (window.marked && window.DOMPurify) {
            return DOMPurify.sanitize(marked.parse(raw));
        }
        return escapeHtml(raw).replace(/\n/g, "<br>");
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatTime(value) {
        if (!value) return "";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        return `${date.getMonth() + 1}/${date.getDate()} ${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
    }

    function toast(message) {
        els.toast.textContent = message;
        els.toast.classList.add("show");
        window.clearTimeout(toast.timer);
        toast.timer = window.setTimeout(() => els.toast.classList.remove("show"), 2400);
    }

    function openDebug() {
        els.debugDrawer.classList.add("open");
        els.drawerBackdrop.classList.add("open");
        els.debugDrawer.setAttribute("aria-hidden", "false");
    }

    function closeDebug() {
        els.debugDrawer.classList.remove("open");
        els.drawerBackdrop.classList.remove("open");
        els.debugDrawer.setAttribute("aria-hidden", "true");
    }

    function bindEvents() {
        els.mockModeBtn.addEventListener("click", () => {
            closeStream();
            setMode("mock");
            loadScenarios();
        });
        els.realModeBtn.addEventListener("click", () => {
            closeStream();
            setMode("real");
        });
        els.sendBtn.addEventListener("click", sendMessage);
        els.messageInput.addEventListener("keydown", event => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });
        const newChat = () => {
            closeStream();
            createSession();
            renderAll();
        };
        els.newChatBtn.addEventListener("click", newChat);
        els.newChatSmallBtn.addEventListener("click", newChat);
        els.debugBtn.addEventListener("click", openDebug);
        els.closeDebugBtn.addEventListener("click", closeDebug);
        els.drawerBackdrop.addEventListener("click", closeDebug);
        document.querySelectorAll("[data-starter]").forEach(button => {
            button.addEventListener("click", () => {
                els.messageInput.value = button.dataset.starter;
                els.messageInput.focus();
            });
        });
    }

    async function boot() {
        loadState();
        bindEvents();
        setMode(state.mode);
        setStatus(state.status);
        renderAll();
        await loadScenarios();
    }

    boot();
</script>
</body>
</html>
