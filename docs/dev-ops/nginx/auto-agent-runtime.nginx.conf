# AutoAgent Runtime nginx 示例配置
# 用法：
# 1. 将本 server 块合并到你的 nginx.conf 的 http { ... } 内。
# 2. 确认 Spring Boot 后端正在监听 127.0.0.1:8091。
# 3. 访问 http://你的电脑IP:18088/ 即可打开 agent_runtime.html。

server {
    listen 18088;
    server_name _;

    root E:/javaProject/ai-agent-station-study/docs/dev-ops/nginx/html;
    index agent_runtime.html index.html;

    location = / {
        try_files /agent_runtime.html =404;
    }

    location / {
        try_files $uri $uri/ /agent_runtime.html;
    }

    location /agent/ {
        proxy_pass http://127.0.0.1:8091/agent/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AutoAgent 前端依赖 SSE 实时事件流，不能让 nginx 缓冲响应。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Dev-only recall evaluation workbench API.
    location /api/v1/dev/recall-evaluations/ {
        proxy_pass http://127.0.0.1:8091/api/v1/dev/recall-evaluations/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
