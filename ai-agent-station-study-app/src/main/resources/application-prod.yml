server:
  port: 8091
  tomcat:
    threads:
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:4}
      max: ${SERVER_TOMCAT_THREADS_MAX:50}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:50}

auto-agent:
  executors:
    agent-execution:
      core-pool-size: ${AUTO_AGENT_EXECUTION_CORE_POOL_SIZE:4}
      max-pool-size: ${AUTO_AGENT_EXECUTION_MAX_POOL_SIZE:8}
      queue-capacity: ${AUTO_AGENT_EXECUTION_QUEUE_CAPACITY:32}
      keep-alive: ${AUTO_AGENT_EXECUTION_KEEP_ALIVE:60s}
      thread-name-prefix: ${AUTO_AGENT_EXECUTION_THREAD_NAME_PREFIX:auto-agent-exec-}
      rejection-policy: ${AUTO_AGENT_EXECUTION_REJECTION_POLICY:CALLER_RUNS}
      allow-core-thread-timeout: ${AUTO_AGENT_EXECUTION_ALLOW_CORE_THREAD_TIMEOUT:false}
      wait-for-tasks-to-complete-on-shutdown: ${AUTO_AGENT_EXECUTION_WAIT_ON_SHUTDOWN:true}
      await-termination: ${AUTO_AGENT_EXECUTION_AWAIT_TERMINATION:30s}
    sse:
      core-pool-size: ${AUTO_AGENT_SSE_CORE_POOL_SIZE:4}
      max-pool-size: ${AUTO_AGENT_SSE_MAX_POOL_SIZE:8}
      queue-capacity: ${AUTO_AGENT_SSE_QUEUE_CAPACITY:16}
      keep-alive: ${AUTO_AGENT_SSE_KEEP_ALIVE:60s}
      thread-name-prefix: ${AUTO_AGENT_SSE_THREAD_NAME_PREFIX:auto-agent-sse-}
      rejection-policy: ${AUTO_AGENT_SSE_REJECTION_POLICY:ABORT}
      allow-core-thread-timeout: ${AUTO_AGENT_SSE_ALLOW_CORE_THREAD_TIMEOUT:false}
      wait-for-tasks-to-complete-on-shutdown: ${AUTO_AGENT_SSE_WAIT_ON_SHUTDOWN:false}
      await-termination: ${AUTO_AGENT_SSE_AWAIT_TERMINATION:5s}
    context-recall:
      core-pool-size: ${AUTO_AGENT_CONTEXT_CORE_POOL_SIZE:4}
      max-pool-size: ${AUTO_AGENT_CONTEXT_MAX_POOL_SIZE:4}
      queue-capacity: ${AUTO_AGENT_CONTEXT_QUEUE_CAPACITY:32}
      keep-alive: ${AUTO_AGENT_CONTEXT_KEEP_ALIVE:60s}
      thread-name-prefix: ${AUTO_AGENT_CONTEXT_THREAD_NAME_PREFIX:auto-agent-context-}
      rejection-policy: ${AUTO_AGENT_CONTEXT_REJECTION_POLICY:CALLER_RUNS}
      allow-core-thread-timeout: ${AUTO_AGENT_CONTEXT_ALLOW_CORE_THREAD_TIMEOUT:false}
      wait-for-tasks-to-complete-on-shutdown: ${AUTO_AGENT_CONTEXT_WAIT_ON_SHUTDOWN:true}
      await-termination: ${AUTO_AGENT_CONTEXT_AWAIT_TERMINATION:15s}
    memory:
      core-pool-size: ${AUTO_AGENT_MEMORY_CORE_POOL_SIZE:4}
      max-pool-size: ${AUTO_AGENT_MEMORY_MAX_POOL_SIZE:4}
      queue-capacity: ${AUTO_AGENT_MEMORY_QUEUE_CAPACITY:128}
      keep-alive: ${AUTO_AGENT_MEMORY_KEEP_ALIVE:60s}
      thread-name-prefix: ${AUTO_AGENT_MEMORY_THREAD_NAME_PREFIX:auto-agent-memory-}
      rejection-policy: ${AUTO_AGENT_MEMORY_REJECTION_POLICY:ABORT}
      allow-core-thread-timeout: ${AUTO_AGENT_MEMORY_ALLOW_CORE_THREAD_TIMEOUT:false}
      wait-for-tasks-to-complete-on-shutdown: ${AUTO_AGENT_MEMORY_WAIT_ON_SHUTDOWN:true}
      await-termination: ${AUTO_AGENT_MEMORY_AWAIT_TERMINATION:30s}
    mcp:
      core-pool-size: ${AUTO_AGENT_MCP_CORE_POOL_SIZE:2}
      max-pool-size: ${AUTO_AGENT_MCP_MAX_POOL_SIZE:4}
      queue-capacity: ${AUTO_AGENT_MCP_QUEUE_CAPACITY:32}
      keep-alive: ${AUTO_AGENT_MCP_KEEP_ALIVE:60s}
      thread-name-prefix: ${AUTO_AGENT_MCP_THREAD_NAME_PREFIX:auto-agent-mcp-}
      rejection-policy: ${AUTO_AGENT_MCP_REJECTION_POLICY:ABORT}
      allow-core-thread-timeout: ${AUTO_AGENT_MCP_ALLOW_CORE_THREAD_TIMEOUT:false}
      wait-for-tasks-to-complete-on-shutdown: ${AUTO_AGENT_MCP_WAIT_ON_SHUTDOWN:true}
      await-termination: ${AUTO_AGENT_MCP_AWAIT_TERMINATION:15s}

