# Redis
redis:
  sdk:
    config:
      host: 127.0.0.1
      port: 16379
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true


# MyBatis 配置
mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

# 日志
logging:
  level:
    root: info
    yhx.com.domain.agent.service.runtime.DeveloperTraceRecorder: warn
    yhx.com.domain.agent.service.runtime.RunEventPublisher: warn
  config: classpath:logback-spring.xml

auto-agent:
  executors:
    agent-execution:
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 32
      keep-alive: 60s
      thread-name-prefix: auto-agent-exec-
      rejection-policy: CALLER_RUNS
      allow-core-thread-timeout: false
      wait-for-tasks-to-complete-on-shutdown: true
      await-termination: 30s
    sse:
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 16
      keep-alive: 60s
      thread-name-prefix: auto-agent-sse-
      rejection-policy: ABORT
      allow-core-thread-timeout: false
      wait-for-tasks-to-complete-on-shutdown: false
      await-termination: 5s
    context-recall:
      core-pool-size: 4
      max-pool-size: 4
      queue-capacity: 32
      keep-alive: 60s
      thread-name-prefix: auto-agent-context-
      rejection-policy: CALLER_RUNS
      allow-core-thread-timeout: false
      wait-for-tasks-to-complete-on-shutdown: true
      await-termination: 15s
    memory:
      core-pool-size: 4
      max-pool-size: 4
      queue-capacity: 128
      keep-alive: 60s
      thread-name-prefix: auto-agent-memory-
      rejection-policy: ABORT
      allow-core-thread-timeout: false
      wait-for-tasks-to-complete-on-shutdown: true
      await-termination: 30s
    mcp:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 32
      keep-alive: 60s
      thread-name-prefix: auto-agent-mcp-
      rejection-policy: ABORT
      allow-core-thread-timeout: false
      wait-for-tasks-to-complete-on-shutdown: true
      await-termination: 15s
  runtime:
    enabled: true
    max-loop-count: 20
    max-contract-repair-attempts: 1
    max-final-repair-attempts: 1
    final-response-guard-enabled: false
    max-consecutive-continue-actions: 2
    max-recovery-attempts-per-failure-code: 2
    main-agent-invocation-mode: ${AUTO_AGENT_MAIN_AGENT_INVOCATION_MODE:TEXT_JSON} # FUNCTION_CALL|TEXT_JSON
  debug:
    debug-api-enabled: true
    debug-sse-enabled: true
    debug-payload-preview-enabled: true
    debug-payload-preview-max-chars: 2000
  rag:
    enabled: true
    vector-name: "vector_store"
    max-queries-per-run: 3
    max-hits-per-query: 10
    max-evidence-snippet-chars: 2000
    asset:
      recall-timeout-millis: 16000
      recall-min-score: 0.40
      recall-top-k: 10
  context:
    vector-recall-timeout-millis: 16000
  mcp:
    enabled: true
    servers:
      - server-id: file-system
        name: File System MCP
        transport: STDIO
        enabled: ${AUTO_AGENT_MCP_FILESYSTEM_ENABLED:true}
        command: ${AUTO_AGENT_MCP_FILESYSTEM_COMMAND:npx.cmd}
        args:
          - -y
          - "@modelcontextprotocol/server-filesystem"
          - ${AUTO_AGENT_MCP_FILESYSTEM_ROOT_1:D:/}
          - ${AUTO_AGENT_MCP_FILESYSTEM_ROOT_2:E:/}
        auto-initialize: false
        auto-discover-tools: true
        auto-register-capabilities: false
        capability-prefix: file_system
        default-permission-mode: ASK_USER
        default-approval-policy: ASK_USER_BEFORE_EXECUTE
        default-risk-level: MEDIUM
        request-timeout-seconds: 60
        tools:
          - tool-name: read_file
            description: Read a file from the configured workspace root.
            required-permission: READ_ONLY
            risk-level: LOW
            schema-less-allowed: true
          - tool-name: read_multiple_files
            description: Read multiple files from the configured workspace root in one call.
            required-permission: READ_ONLY
            risk-level: LOW
            schema-less-allowed: true
          - tool-name: list_directory
            description: List files under the configured workspace root.
            required-permission: READ_ONLY
            risk-level: LOW
            schema-less-allowed: true
          - tool-name: directory_tree
            description: Return a recursive directory tree under the configured workspace root.
            required-permission: READ_ONLY
            risk-level: LOW
            schema-less-allowed: true
          - tool-name: search_files
            description: Search files under the configured workspace root.
            required-permission: READ_ONLY
            risk-level: LOW
            schema-less-allowed: true
          - tool-name: get_file_info
            description: Return metadata for a file or directory under the configured workspace root.
            required-permission: READ_ONLY
            risk-level: LOW
            schema-less-allowed: true
          - tool-name: list_allowed_directories
            description: List filesystem roots allowed by the configured filesystem MCP server.
            required-permission: READ_ONLY
            risk-level: LOW
            schema-less-allowed: true
          - tool-name: write_file
            description: Create or write a file under the configured workspace root.
            required-permission: WORKSPACE_WRITE
            risk-level: HIGH
            destructive: true
            schema-less-allowed: true
          - tool-name: edit_file
            description: Apply edits to a file under the configured workspace root.
            required-permission: WORKSPACE_WRITE
            risk-level: HIGH
            destructive: true
            schema-less-allowed: true
          - tool-name: create_directory
            description: Create a directory under the configured workspace root.
            required-permission: WORKSPACE_WRITE
            risk-level: HIGH
            destructive: true
            schema-less-allowed: true
          - tool-name: move_file
            description: Move or rename a file under the configured workspace root.
            required-permission: WORKSPACE_WRITE
            risk-level: HIGH
            destructive: true
            schema-less-allowed: true
      - server-id: baidu-ai-search
        name: Baidu AI Search MCP
        transport: SSE
        enabled: ${AUTO_AGENT_MCP_BAIDU_SEARCH_ENABLED:true}
        url: http://appbuilder.baidu.com/v2/ai_search/mcp/
        sse-endpoint: ${AUTO_AGENT_MCP_BAIDU_SEARCH_SSE_ENDPOINT:sse?api_key=Bearer+bce-v3/ALTAK-oACkdcBrv9k3AzEB88B1M/f2b0a6ad1e63ff70b49cdb3770684f68b69971f0}
        auto-initialize: false
        auto-discover-tools: true
        auto-register-capabilities: true
        capability-prefix: baidu_ai_search
        default-required-permission: READ_ONLY
        default-permission-mode: ALLOW
        default-approval-policy: NEVER
        default-risk-level: LOW
        request-timeout-seconds: 100
        tools:
          - tool-name: AIsearch
            description: Search current public web information with Baidu AI Search. Use when the user needs live, recent, or external web information. Required argument is query.
            required-permission: READ_ONLY
            risk-level: LOW
            schema-less-allowed: true
            input-schema:
              type: object
              properties:
                query:
                  type: string
                  description: Search query keywords or natural-language question.
                instruction:
                  type: string
                  description: Optional instruction for result style, filtering, or summary format.
                model:
                  type: string
                  description: Optional model name for search result summarization.
                search_domain_filter:
                  type: array
                  items:
                    type: string
                  description: Optional list of domains to restrict search results.
                resource_type_filter:
                  type: array
                  items:
                    type: object
                  description: Optional resource type filters such as web/image/video.
              required:
                - query
      - server-id: csdn-publisher
        name: CSDN Publisher MCP
        transport: SSE
        enabled: ${AUTO_AGENT_MCP_CSDN_ENABLED:true}
        url: ${AUTO_AGENT_MCP_CSDN_URL:http://127.0.0.1:18080}
        sse-endpoint: ${AUTO_AGENT_MCP_CSDN_SSE_ENDPOINT:/sse}
        auto-initialize: false
        auto-discover-tools: true
        auto-register-capabilities: true
        capability-prefix: csdn_publisher
        default-required-permission: EXTERNAL_WRITE
        default-permission-mode: ASK_USER
        default-approval-policy: ASK_USER_BEFORE_EXECUTE
        default-risk-level: HIGH
        default-destructive: false
        default-content-mode: SUMMARY_ONLY
        request-timeout-seconds: 180
        tools:
          - tool-name: publishArticle
            description: Publish an approved Markdown article to CSDN. Requires title, markdowncontent, tags, and description under request.
            required-permission: EXTERNAL_WRITE
            risk-level: HIGH
            destructive: false
            schema-less-allowed: true
            input-schema:
              type: object
              additionalProperties: false
              properties:
                request:
                  type: object
                  properties:
                    title:
                      type: string
                      description: Article title.
                    markdowncontent:
                      type: string
                      description: Markdown article body.
                    tags:
                      type: string
                      description: Article tags separated by commas.
                    description:
                      type: string
                      description: Article summary.
                  required:
                    - title
                    - markdowncontent
                    - tags
                    - description
              required:
                - request
  capabilities:
    tools:
      - capability-id: baidu_ai_search_aisearch
        capability-type: TOOL
        display-name: Baidu AI Search
        mcp-server-id: baidu-ai-search
        mcp-tool-name: AIsearch
        required-permission: READ_ONLY
        permission-mode: ALLOW
        approval-policy: NEVER
        risk-level: LOW
        default-content-mode: FULL_TEXT_REQUIRED
        enabled: ${AUTO_AGENT_MCP_BAIDU_SEARCH_ENABLED:true}
      - capability-id: csdn_publisher_publisharticle
        capability-type: TOOL
        display-name: Publish CSDN article
        mcp-server-id: csdn-publisher
        mcp-tool-name: publishArticle
        required-permission: EXTERNAL_WRITE
        permission-mode: ASK_USER
        approval-policy: ASK_USER_BEFORE_EXECUTE
        risk-level: HIGH
        destructive: false
        default-content-mode: SUMMARY_ONLY
        enabled: ${AUTO_AGENT_MCP_CSDN_ENABLED:true}
      - capability-id: file_system_read_file
        capability-type: TOOL
        display-name: Read file
        mcp-server-id: file-system
