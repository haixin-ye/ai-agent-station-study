  ai:
    openai:
      base-url: https://api.apimart.ai
      api-key: XXXXsk-2ikk1D2
    agent:
      auto-config:
        enabled: true
        client-ids: 3101,3102,3103,3104
        rag-api-id: "1002"
        vector_name: "vector_store"
        embedding-model-name: text-embedding-3-large
        dimensions: 1536



# Redis
redis:
  sdk:
    config:
      host: 127.0.0.1
      port: 16379
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true


# MyBatis 配置
mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml

auto-agent:
  runtime:
    enabled: true
    max-loop-count: 8
    max-contract-repair-attempts: 1
    max-final-repair-attempts: 1
    max-consecutive-continue-actions: 1
    max-recovery-attempts-per-failure-code: 2
  debug:
    debug-api-enabled: true
    debug-sse-enabled: true
    debug-payload-preview-enabled: true
    debug-payload-preview-max-chars: 2000
  nodes:
    models:
      CONTEXT_PLANNER:
        model-code: "3101"
        prompt-version: "v1"
        temperature: 0.1
        max-output-tokens: 1600
        max-repair-attempts: 1
      MAIN_AGENT:
        model-code: "3101"
        prompt-version: "v1"
        temperature: 0.2
        max-output-tokens: 2400
        max-repair-attempts: 1
      RAG_VERIFIER:
        model-code: "3101"
        prompt-version: "v1"
        temperature: 0.0
        max-output-tokens: 1200
        max-repair-attempts: 1
      FINAL_REPAIR:
        model-code: "3101"
        prompt-version: "v1"
        temperature: 0.1
        max-output-tokens: 1200
        max-repair-attempts: 1
      CONTRACT_REPAIR:
        model-code: "3101"
        prompt-version: "v1"
        temperature: 0.0
        max-output-tokens: 1200
        max-repair-attempts: 1
  mcp:
    enabled: true
    servers: []
  capabilities:
    tools: []
